name: Android CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Install source validation tools
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes ripgrep
          fi
          rg --version
      - name: Verify source contracts
        run: ./scripts/ci-run-gate.sh --source
      - name: Check change-range whitespace
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$GITHUB_BASE_REF" ]; then
            base="$(git merge-base "origin/$GITHUB_BASE_REF" HEAD)"
          elif [ -n "$PUSH_BEFORE" ] && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            base="$PUSH_BEFORE"
          else
            base="$(git hash-object -t tree /dev/null)"
          fi
          git diff --check "$base" HEAD
      - name: Save source diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-source-${{ github.sha }}
          retention-days: 1
          if-no-files-found: ignore
          path: build/ci/

  runtime-assets:
    needs: source
    # Build the existing arm64 Docker/Alpine pipeline natively; no Docker daemon
    # is assumed on the macOS Android build runner. The content lock is unchanged.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Configure JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Configure Android SDK for the JVM asset gate
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          # The action defaults to the retired `tools` package. This job needs
          # only sdkmanager; install the specific platform below.
          packages: ""
      - name: Install asset build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes libarchive-tools
          sdkmanager "platforms;android-36" "platforms;android-37.0" "build-tools;36.0.0"
      - name: Build and verify locked runtime assets
        env:
          HELIX_ROOTFS_ARCHIVE_URL: ${{ vars.HELIX_ROOTFS_ARCHIVE_URL }}
        run: ./scripts/build-proot-assets.sh
      - name: Transfer verified runtime inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: locked-runtime-inputs
          retention-days: 1
          if-no-files-found: error
          path: |
            runtime/proot-app/src/main/assets/runtime/proot
            runtime/proot-app/src/main/assets/runtime/rootfs

  android:
    needs: runtime-assets
    runs-on: macos-15
    # Two bounded shards overlap lint with tests/packaging. No gate is removed.
    strategy:
      fail-fast: false
      matrix:
        gate: [analysis, tests-build]
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Configure JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0 (node24)

      - name: Configure Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1 (node24)
        with:
          # Keep package installation explicit in the next step; never request
          # the action's legacy `tools` default.
          packages: ""

      - name: Install Android platform and native toolchain
        # cmdline-tools;latest keeps `cmdline-tools/latest/bin/apkanalyzer` available for
        # verify-variant-boundaries.sh on a cold runner.
        run: |
          sdkmanager "platforms;android-36" "platforms;android-37.0" "build-tools;36.0.0" "platform-tools" \
            "cmdline-tools;latest" "ndk;28.2.13676358" "cmake;3.31.6"
          "$ANDROID_HOME/cmake/3.31.6/bin/cmake" --version
          test -f "$ANDROID_HOME/ndk/28.2.13676358/source.properties"

      - name: Install repository validation tools
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            brew install ripgrep
          fi
          rg --version

      - name: Receive locked runtime inputs from this workflow
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: locked-runtime-inputs
          path: runtime/proot-app/src/main/assets/runtime

      - name: Verify runtime inputs before building APKs
        run: ./gradlew :app:verifyDeveloperRuntimeAssets

      - name: Run ${{ matrix.gate }} gate
        run: ./scripts/ci-run-gate.sh --${{ matrix.gate }}

      - name: Upload debug APKs
        if: matrix.gate == 'tests-build'
        # Debug-signed build artifacts for installation (development use, not for
        # distribution). retention-days: 1 keeps storage in the free 2 GB tier
        # across routine runs. Uploaded right after the
        # build so the APKs survive even if a later gate step fails. The bundle
        # contains one direct-distribution main-app candidate (developer), one
        # restricted-channel boundary artifact (consumer). Runtime libraries are
        # linked into developer and are not additional installable applications.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (node24)
        with:
          name: helix-apks-${{ github.sha }}
          retention-days: 1
          path: |
            app/build/outputs/apk/consumer/debug/app-consumer-debug.apk
            app/build/outputs/apk/developer/debug/app-developer-debug.apk

      - name: Describe debug APK roles
        if: matrix.gate == 'tests-build'
        run: |
          printf '%s\n' \
            '## Debug APK artifact roles' \
            '' \
            '| APK | Role |' \
            '| --- | --- |' \
            '| `app-developer-debug.apk` | Current direct-distribution Helix main-app candidate; defaults to Standard |' \
            '| `app-consumer-debug.apk` | Restricted-channel/variant-boundary artifact; not the default user download |' \
            '> Subscriptions and PRoot are built into developer; there are no companion APKs.' \
            '' \
            '> Debug-signed development artifacts only; not release evidence.' \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Verify APK boundaries
        if: matrix.gate == 'tests-build'
        run: ./scripts/ci-run-gate.sh --artifacts

      - name: Save gate diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-${{ matrix.gate }}-${{ github.sha }}
          retention-days: 1
          if-no-files-found: ignore
          path: |
            build/ci/
            **/build/test-results/**/*.xml
            **/build/reports/lint-results*.xml
            build/reports/detekt/

  # Keep the existing required check name. Skips, cancellation and either failed
  # shard must fail the aggregate instead of leaving a misleading green result.
  verify:
    if: always()
    needs: [source, runtime-assets, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every gate
        env:
          SOURCE_RESULT: ${{ needs.source.result }}
          ASSETS_RESULT: ${{ needs.runtime-assets.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
        run: |
          test "$SOURCE_RESULT" = success
          test "$ASSETS_RESULT" = success
          test "$ANDROID_RESULT" = success
