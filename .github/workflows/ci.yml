name: Android CI

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Verification scope
        type: choice
        options: [full, debug]
        default: full
        required: true
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: android-ci-${{ github.event_name == 'workflow_dispatch' && 'manual' || 'routine' }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  source:
    outputs:
      scope: ${{ steps.plan.outputs.scope }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Select verification scope
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/plan.py
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Install source validation tools
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes ripgrep
          fi
          rg --version
      - name: Verify source contracts
        run: ./scripts/ci-run-gate.sh --source
      - name: Check change-range whitespace
        env:
          CI_BASE: ${{ steps.plan.outputs.base }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: python3 scripts/ci/plan.py --check-whitespace
      - name: Save source diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-source-${{ github.sha }}
          retention-days: 1
          if-no-files-found: ignore
          path: build/ci/

  runtime-assets:
    needs: source
    if: needs.source.outputs.scope != 'source'
    # Fetch locked published assets, then retain extraction and ELF/ABI checks.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Configure JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Configure Gradle for asset verification
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Restore locked downloads
        id: downloads
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/helix-runtime-downloads
          key: runtime-downloads-v1-${{ hashFiles('**/runtime-lock.json', 'scripts/build-proot-assets.sh', 'scripts/ci/fetch_locked_asset.py') }}
      - name: Configure Android SDK for the JVM asset gate
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          # The action defaults to the retired `tools` package. This job needs
          # only sdkmanager; install the specific platform below.
          packages: ""
      - name: Install asset build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes libarchive-tools
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - name: Build and verify locked runtime assets
        env:
          HELIX_RUNTIME_DOWNLOAD_CACHE: ${{ runner.temp }}/helix-runtime-downloads
          HELIX_ROOTFS_ARCHIVE_URL: ${{ vars.HELIX_ROOTFS_ARCHIVE_URL }}
        run: ./scripts/build-proot-assets.sh
      - name: Save verified downloads
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/helix-runtime-downloads
          key: ${{ steps.downloads.outputs.cache-primary-key }}
      - name: Transfer verified runtime inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: locked-runtime-inputs
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
          path: |
            runtime/proot-app/src/main/assets/runtime/proot
            runtime/proot-app/src/main/assets/runtime/rootfs

  android:
    needs: [source, runtime-assets]
    if: needs.source.outputs.scope != 'source'
    runs-on: ubuntu-24.04
    # One workspace shares configuration, compiled outputs and Gradle task caches.
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Configure JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0 (node24)

      - name: Configure Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1 (node24)
        with:
          # Keep package installation explicit in the next step; never request
          # the action's legacy `tools` default.
          packages: ""

      - name: Install Android platform and native toolchain
        # cmdline-tools;latest keeps `cmdline-tools/latest/bin/apkanalyzer` available for
        # verify-variant-boundaries.sh on a cold runner.
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "platform-tools" \
            "cmdline-tools;latest" "ndk;28.2.13676358" "cmake;3.31.6"
          "$ANDROID_HOME/cmake/3.31.6/bin/cmake" --version
          test -f "$ANDROID_HOME/ndk/28.2.13676358/source.properties"

      - name: Install repository validation tools
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes ripgrep
          fi
          rg --version

      - name: Receive locked runtime inputs from this workflow
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: locked-runtime-inputs
          path: runtime/proot-app/src/main/assets/runtime

      - name: Restore prepared speech inputs
        id: speech
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: speech-${{ runner.os }}-${{ runner.arch }}-ndk28.2.13676358-cmake3.31.6-${{ hashFiles('config/asr/**', 'config/tts/**', 'scripts/build-asr-assets.py', 'scripts/build-tts-assets.py', 'scripts/prepare-asr-download-assets.py', 'scripts/ci/fetch_locked_asset.py') }}
          path: |
            build/asr/manifest.json
            build/asr/asr-only.aar
            build/asr/assets
            build/asr/test-assets
            build/asr-download/manifest.json
            build/asr-download/assets
            build/asr-download/test-assets
            build/tts/manifest.json
            build/tts/speech.aar
            build/tts/assets
            build/tts/test-assets
      - name: Prepare locked speech inputs once
        if: steps.speech.outputs.cache-hit != 'true'
        run: |
          python3 scripts/build-asr-assets.py
          python3 scripts/prepare-asr-download-assets.py
          python3 scripts/build-tts-assets.py
      - name: Verify prepared speech inputs, including cache hits
        run: |
          python3 scripts/build-asr-assets.py --verify
          python3 scripts/prepare-asr-download-assets.py --verify
          python3 scripts/build-tts-assets.py --verify
      - name: Save verified speech inputs
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.speech.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.speech.outputs.cache-primary-key }}
          path: |
            build/asr/manifest.json
            build/asr/asr-only.aar
            build/asr/assets
            build/asr/test-assets
            build/asr-download/manifest.json
            build/asr-download/assets
            build/asr-download/test-assets
            build/tts/manifest.json
            build/tts/speech.aar
            build/tts/assets
            build/tts/test-assets
      - name: Run selected Android gate
        env:
          CI_SCOPE: ${{ needs.source.outputs.scope }}
        run: |
          case "$CI_SCOPE" in
            debug)
              ./scripts/ci-run-gate.sh --debug-build-analysis
              ;;
            full) ./scripts/ci-run-gate.sh --build ;;
            *) exit 2 ;;
          esac
          ./scripts/ci-run-gate.sh --artifacts
          if [ "$CI_SCOPE" = full ]; then
            ./scripts/ci-run-gate.sh --release-artifacts
          fi

      # Small task profiles are useful on successful runs too; no APK/test-data upload.
      - name: Save Gradle performance profiles
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-profiles-${{ github.sha }}
          retention-days: 1
          if-no-files-found: error
          path: build/reports/profile/

      - name: Save gate diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-android-${{ github.sha }}
          retention-days: 1
          if-no-files-found: ignore
          path: |
            build/ci/
            **/build/test-results/**/*.xml
            **/build/reports/lint-results*.xml
            build/reports/detekt/
            build/reports/profile/

  # Preserve the required check; only the planned source-only skips are accepted.
  verify:
    if: always()
    needs: [source, runtime-assets, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out verification policy
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Require selected gates
        env:
          CI_SCOPE: ${{ needs.source.outputs.scope }}
          SOURCE_RESULT: ${{ needs.source.result }}
          ASSETS_RESULT: ${{ needs.runtime-assets.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
        run: python3 scripts/ci/plan.py --verify
