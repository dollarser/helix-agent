name: Android CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-15
    # Headroom for the per-module lintDebug tasks (warningsAsErrors) on a cold runner.
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Full history so the whitespace check below can diff the actual change range
          # (merge base on PRs, HEAD~1 on pushes) instead of an always-clean worktree.
          fetch-depth: 0

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0 (node24)

      - name: Configure JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0 (node24)

      - name: Configure Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1 (node24)

      - name: Install Android platform
        # cmdline-tools;latest keeps `cmdline-tools/latest/bin/apkanalyzer` available for
        # verify-variant-boundaries.sh on a cold runner.
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" "cmdline-tools;latest"

      - name: Static checks and tests
        # :core:storage:lintDebug covers the Room module the app lints do not reach
        # (lintConsumerDebug only lints :app and its consumers' views of it).
        run: ./gradlew spotlessCheck detekt test :core:storage:lintDebug lintConsumerDebug lintDeveloperDebug

      - name: Build all M0 applications
        run: >-
          ./gradlew
          :app:assembleConsumerDebug
          :app:assembleDeveloperDebug
          :runtime:proot-app:assembleDebug
          :runtime:cli-app:assembleDebug

      - name: Upload debug APKs
        # Debug-signed build artifacts for installation (development use, not for
        # distribution). retention-days: 1 keeps storage in the free 2 GB tier
        # regardless of push volume (~68 MB per run). Uploaded right after the
        # build so the APKs survive even if a later gate step fails. The bundle
        # contains one direct-distribution main-app candidate (developer), one
        # restricted-channel boundary artifact (consumer), and two companions.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (node24)
        with:
          name: helix-apks-${{ github.sha }}
          retention-days: 1
          path: |
            app/build/outputs/apk/consumer/debug/app-consumer-debug.apk
            app/build/outputs/apk/developer/debug/app-developer-debug.apk
            runtime/proot-app/build/outputs/apk/debug/proot-app-debug.apk
            runtime/cli-app/build/outputs/apk/debug/cli-app-debug.apk

      - name: Describe debug APK roles
        run: |
          printf '%s\n' \
            '## Debug APK artifact roles' \
            '' \
            '| APK | Role |' \
            '| --- | --- |' \
            '| `app-developer-debug.apk` | Current direct-distribution Helix main-app candidate; defaults to Standard |' \
            '| `app-consumer-debug.apk` | Restricted-channel/variant-boundary artifact; not the default user download |' \
            '| `proot-app-debug.apk` | Optional PRoot companion Runtime |' \
            '| `cli-app-debug.apk` | Optional experimental CLI companion Runtime |' \
            '' \
            '> Debug-signed development artifacts only; not release evidence.' \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Verify dependency locks
        run: ./scripts/check-lockfiles.sh

      - name: Scan for secrets
        run: ./scripts/check-secrets.sh

      - name: Verify architecture decisions
        run: ./scripts/verify-adr.sh

      - name: Verify documentation contracts
        run: ./scripts/check-docs.sh

      - name: Verify variant boundaries
        run: ./scripts/verify-variant-boundaries.sh

      - name: Check whitespace
        # `git diff --check` on a fresh checkout inspects an always-empty worktree diff and
        # can never fail; check the actual change range instead (merge base on PRs,
        # the last commit on pushes).
        run: |
          if [ -n "$GITHUB_BASE_REF" ] && git rev-parse --verify "origin/$GITHUB_BASE_REF" >/dev/null 2>&1; then
            git diff --check "$(git merge-base "origin/$GITHUB_BASE_REF" HEAD)" HEAD
          else
            git diff --check HEAD~1 HEAD
          fi
