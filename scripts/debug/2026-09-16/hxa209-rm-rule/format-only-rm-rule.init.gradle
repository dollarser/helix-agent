// Narrows the root spotless "kotlin" format to the two HXA-209 A-slice files so
// `spotlessKotlinApply` reformats only them. The full-project spotlessCheck gate
// is unchanged; files owned by other slices (e.g. the parallel-session probe
// tests) are left untouched.
projectsEvaluated {
    def spotless = rootProject.extensions.findByName('spotless')
    def kotlin = spotless.formats.get('kotlin')
    if (kotlin == null) {
        throw new GradleException('spotless kotlin format not found')
    }
    kotlin.target(
        'core/policy/src/main/kotlin/com/helix/core/policy/RmCommandRule.kt',
        'core/policy/src/test/kotlin/com/helix/core/policy/RmCommandRuleTest.kt',
    )
}
