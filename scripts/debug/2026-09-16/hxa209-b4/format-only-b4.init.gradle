// Narrows the root spotless "kotlin" format to the HXA-209 B4 files so
// `spotlessKotlinApply` reformats only them. The full-project spotlessCheck gate
// is unchanged; files owned by other slices are left untouched.
projectsEvaluated {
    def spotless = rootProject.extensions.findByName('spotless')
    def kotlin = spotless.formats.get('kotlin')
    if (kotlin == null) {
        throw new GradleException('spotless kotlin format not found')
    }
    kotlin.target(
        'core/storage/src/main/kotlin/com/helix/core/storage/HelixDatabase.kt',
        'core/storage/src/main/kotlin/com/helix/core/storage/HelixMigrations.kt',
        'core/storage/src/main/kotlin/com/helix/core/storage/HelixStorage.kt',
        'core/storage/src/androidTest/kotlin/com/helix/core/storage/RoomMigrationFixtureTest.kt',
        'tools/framework/src/main/kotlin/com/helix/tools/framework/DispatchAudit.kt',
        'tools/framework/src/main/kotlin/com/helix/tools/framework/ToolDispatcher.kt',
        'tools/framework/src/test/kotlin/com/helix/tools/framework/SessionPermissionStageTest.kt',
        'tools/framework/src/test/kotlin/com/helix/tools/framework/ToolDispatcherTest.kt',
        'tools/framework/src/test/kotlin/com/helix/tools/framework/ToolSchedulerTest.kt',
        'app/src/main/kotlin/com/helix/app/AppContainer.kt',
        'app/src/main/kotlin/com/helix/app/DefaultAppContainer.kt',
        'app/src/main/kotlin/com/helix/app/MainActivity.kt',
        'app/src/main/kotlin/com/helix/app/approval/StorageAuditSink.kt',
        'app/src/main/kotlin/com/helix/app/chat/ChatRequestAssembler.kt',
        'app/src/main/kotlin/com/helix/app/tool/ToolPipeline.kt',
        'app/src/main/kotlin/com/helix/app/ui/ApprovalCardScreen.kt',
        'app/src/main/kotlin/com/helix/app/ui/ChatScreen.kt',
        'app/src/main/kotlin/com/helix/app/ui/ConversationIntents.kt',
        'app/src/main/kotlin/com/helix/app/ui/SettingsScreen.kt',
        'app/src/main/kotlin/com/helix/app/ui/ToolTimelineItem.kt',
        'app/src/test/kotlin/com/helix/app/approval/DispatchAuditPayloadTest.kt',
        'app/src/androidTest/kotlin/com/helix/app/ApprovalFlowDeviceTest.kt',
        'app/src/androidTest/kotlin/com/helix/app/connector/ConnectorUiDeviceTest.kt',
    )
}
