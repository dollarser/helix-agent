// Narrows the root spotless "kotlin" format to the HXA-202 slice 4 file so
// `spotlessKotlinApply` reformats only it. The full-project spotlessCheck gate
// is unchanged; files owned by other slices are left untouched.
projectsEvaluated {
    def spotless = rootProject.extensions.findByName('spotless')
    def kotlin = spotless.formats.get('kotlin')
    if (kotlin == null) {
        throw new GradleException('spotless kotlin format not found')
    }
    kotlin.target(
        'app/src/androidTest/kotlin/com/helix/app/TaskJourneyDeviceTest.kt',
    )
}
