// Narrows the root spotless "kotlin" format to the HXA-192 device-acceptance files so
// `spotlessKotlinApply` reformats only them. The full-project spotlessCheck gate
// is unchanged; files owned by other slices (e.g. the parallel HXA-094/095 Root work)
// are left untouched.
projectsEvaluated {
    def spotless = rootProject.extensions.findByName('spotless')
    def kotlin = spotless.formats.get('kotlin')
    if (kotlin == null) {
        throw new GradleException('spotless kotlin format not found')
    }
    kotlin.target(
        // HXA-192 device acceptance: the Plan review -> execute closed loop (UI), the durable
        // idempotency/drift gate (storage), the two-phase process-recovery, and the 209 linkage.
        'app/src/androidTest/kotlin/com/helix/app/plan/PlanExecuteCloseLoopDeviceTest.kt',
        'app/src/androidTest/kotlin/com/helix/app/plan/PlanExecutionAcceptanceDeviceTest.kt',
        'app/src/androidTest/kotlin/com/helix/app/plan/PlanExecutionRecoveryDeviceTest.kt',
        'app/src/androidTest/kotlin/com/helix/app/plan/PlanAuthorizationLinkageDeviceTest.kt',
    )
}
