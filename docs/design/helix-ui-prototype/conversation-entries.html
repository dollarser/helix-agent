<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; base-uri 'none'; form-action 'none'"><title>Helix · 会话操作入口原型</title>
<style>
:root{font:16px/1.5 system-ui,sans-serif;color:#25352f;background:#eef1ed;--paper:#fff;--muted:#65746d;--line:#dbe3db;--green:#28684e;--soft:#edf5ef}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer;min-height:48px;border:0;border-radius:12px;background:transparent;color:inherit;padding:10px 14px;text-align:left}button:hover{background:var(--soft)}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #71a98d;outline-offset:2px}button:disabled{opacity:.5;cursor:default}.review{padding:18px 28px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:20px}.review p{margin:2px 0;font-size:13px;color:var(--muted)}.layout{display:grid;grid-template-columns:minmax(220px,300px) minmax(320px,540px);gap:40px;justify-content:center;padding:32px 18px}.notes h1{font-size:28px;letter-spacing:-1px}.notes p{color:var(--muted)}.notes button{display:block;width:100%;border-bottom:1px solid var(--line);border-radius:0}.phone{background:var(--paper);border:1px solid var(--line);border-radius:24px;height:780px;max-height:calc(100dvh - 140px);min-height:560px;display:flex;flex-direction:column;position:relative;overflow:hidden;box-shadow:0 12px 35px #233f3010}.top{display:flex;align-items:center;padding:12px 8px;border-bottom:1px solid var(--line)}.grow{flex:1;min-width:0}.top strong{font-size:16px}.top small{display:block;color:var(--muted);font-size:12px}.messages{flex:1;padding:24px;overflow:auto}.bubble{padding:14px 18px;border-radius:18px;background:var(--soft);margin:16px 0 24px 30px}.answer{margin:20px 0;color:#3d5145}.composer{padding:12px 14px 18px;border-top:1px solid var(--line)}.row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.scope{font-size:12px;color:var(--muted)}.composer textarea{width:100%;resize:vertical;border:0;outline:0;padding:12px 6px;min-height:60px;max-height:150px;background:transparent}.box{border:1px solid var(--line);border-radius:18px;padding:6px}.primary{background:var(--green);color:white}.primary:hover{background:#20573f}.chip{background:var(--soft);border:1px solid var(--line);font-size:12px;min-height:36px;padding:5px 10px}.overlay{position:absolute;inset:0;background:#15251e44;display:flex;align-items:flex-end}.overlay[hidden]{display:none}.sheet{background:var(--soft);border-radius:22px 22px 0 0;width:100%;max-height:92%;overflow:auto;padding:12px 18px 22px;box-shadow:0 -8px 40px #15251e18}.sheet h2{font-size:20px;margin:6px 0}.sheet header{display:flex;align-items:center;justify-content:space-between;gap:12px}.sheet p{color:var(--muted);font-size:14px;margin:6px 0 18px}.item{width:100%;display:block;border:0;border-radius:12px;margin:2px 0;min-height:56px;padding:10px 12px}.item strong,.item small{display:block}.item small{color:var(--muted);font-size:12px}.group{margin:18px 0 6px;font-size:12px;color:var(--muted)}input,select,textarea.editor{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:inherit;margin:5px 0 10px}label{display:block;font-size:14px}.footer{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.notice{padding:12px;background:var(--soft);border-radius:12px;margin:12px 0;font-size:13px}.error{color:#a03b32!important}.empty{padding:28px 12px;text-align:center;color:var(--muted)}.status{font-size:12px;color:var(--green);min-height:18px;margin:6px}.dark{--paper:#1b2922;--muted:#a2b3a6;--line:#394b40;--green:#327653;--soft:#273c30;color:#e2ece3;background:#111b16}.dark .answer{color:#c3d5c8}@media(max-width:740px){.layout{display:block;padding:12px}.notes{display:none}.phone{max-height:none;height:calc(100dvh - 120px);min-height:520px;max-width:480px;margin:auto}.review{padding:10px 16px;font-size:14px}.review p{max-width:240px}.review button{padding:8px}}
</style></head><body>
<div class="review"><div><strong>HELIX / 会话操作入口</strong><p>交互原型 · 合成数据 · 不执行真实操作</p></div><button id="theme">切换明暗</button></div>
<div class="layout"><aside class="notes"><h1>入口跟着任务走。</h1><p>添加材料、选择能力、调整运行、管理会话，各有明确位置。</p><button data-open="add">＋ 添加与引用</button><button data-open="top">顶部 ⋮ 会话管理</button><button data-open="run">输入区 ⋮ 输入选项</button><button data-open="settings">应用设置</button><p>建议走一遍：会话引用 → 选择专家 → 选择插件。再试取消、搜索无结果、待配置插件和管理专家后返回。</p><label>引用目录状态<select id="directory-state"><option value="ready">正常 · 有已有会话</option><option value="loading">正在加载</option><option value="empty">没有其他会话</option><option value="error">读取失败</option></select></label></aside>
<section class="phone" aria-label="会话原型"><header class="top"><button data-open="nav" aria-label="打开导航">☰</button><div class="grow"><strong>整理产品接入方案</strong><small>当前会话</small></div><button data-open="search" aria-label="会话内搜索">⌕</button><button data-open="top" aria-label="会话管理">⋮</button></header><div class="messages"><span class="scope">今天 · 示例会话</span><div class="bubble">把之前的研究和这份方案一起核对。</div><div class="answer">可以添加需要参考的材料，再选择适合这项工作的专家与插件。</div></div><div class="composer"><div class="row"><span class="scope">Act · 按需询问</span><span class="grow"></span><button data-open="context" aria-label="上下文占用 12%">◔ 12%</button><button data-open="run" aria-label="输入选项">⋮</button></div><div id="chips" class="row"></div><div class="box"><textarea id="draft" aria-label="消息草稿" placeholder="发消息…">重点看看返回链和权限边界。</textarea><div class="row"><button data-open="add" aria-label="添加到消息">＋</button><button data-open="model">示例模型 ⌄</button><span class="grow"></span><button data-open="voice" aria-label="语音输入">♩</button><button id="send" class="primary" aria-label="发送演示消息">↑</button></div></div><div id="status" class="status" role="status"></div></div><div id="overlay" class="overlay" hidden></div></section></div>
<script>
'use strict';
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const S={session:'current',draft:'',reference:null,expert:null,plugins:[],skills:[],attachment:null,returnTo:null,experts:[{id:'android',name:'Android 工程师',body:'检查 Android 生命周期与权限边界。'},{id:'research',name:'产品研究员',body:'区分事实与建议，保留来源。'}],sessions:[{id:'permissions',name:'Android 权限研究',kind:'近期消息',date:'昨天'},{id:'cancel',name:'取消与恢复设计',kind:'已有摘要',date:'10 月 25 日'},{id:'archive',name:'输入体验复盘',kind:'近期消息 · 已归档',date:'10 月 22 日'}],directory:'ready',modal:null,candidate:[],origin:null,buffers:{},nextExpertId:1};
const item=(title,action,sub='')=>`<button class="item" data-action="${action}"><strong>${esc(title)}</strong>${sub?`<small>${esc(sub)}</small>`:''}</button>`;
function show(type,body,title,foot=''){S.modal=type;$('#overlay').hidden=false;$('#overlay').innerHTML=`<section class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><header><h2>${esc(title)}</h2><button data-action="close" aria-label="关闭面板">×</button></header>${body}${foot?`<div class="footer">${foot}</div>`:''}</section>`;$('#overlay button')?.focus()}
function close(){S.modal=null;$('#overlay').hidden=true;$('#overlay').innerHTML='';S.origin?.focus()}
function chips(){const entries=[['reference',S.reference&&'引用 · '+S.reference.name],['expert',S.expert&&'专家 · '+S.expert.name],['plugins',S.plugins.length&&'插件 · '+S.plugins.join('、')],['skills',S.skills.length&&'技能 · '+S.skills.join('、')],['attachment',S.attachment]];$('#chips').innerHTML=entries.filter(x=>x[1]).map(([k,v])=>`<button class="chip" data-action="${k==='expert'?'open:experts':k==='plugins'?'open:plugins':'remove:'+k}" aria-label="${k==='expert'||k==='plugins'?'调整':'移除'}${esc(v)}">${esc(v)} ${k==='expert'||k==='plugins'?'⌄':'×'}</button>`).join('')}
function open(type){switch(type){
case 'add':show(type,'<div class="group">材料</div>'+item('拍照','material:示例照片.jpg')+item('照片','material:示例图片.png')+item('文件','material:接入方案.pdf')+item('引用其他会话','open:references','加入当前消息；发送时冻结有界内容')+item('引用知识库','open:knowledge')+'<div class="group">已有能力</div>'+item('选择专家','open:experts',(S.expert?.name||'默认助手')+' · 当前会话后续输入')+item('选择插件','open:plugins',(S.plugins.join('、')||'未选择')+' · 当前会话')+item('使用技能','open:skills','只加入当前消息，不立即执行'),'添加到消息');break;
case 'top':show(type,'<p>管理整个当前会话。</p>'+item('会话设置','open:session','项目、工作目录、会话权限与上下文策略')+item('重命名','open:rename')+item('导出会话','info:保留现有导出流程')+item('当前任务与成果','info:保留任务、Goal、成果与中断恢复入口')+item('Git 状态','info:保留当前工作目录的 Git 入口')+'<p>归档与删除保留在全部会话列表中。</p>','会话管理');break;
case 'run':show(type,'<p>只控制消息的投递方式。</p>'+item('立即发送','delivery:立即发送','处理中按此方式发送新消息；空闲时正常发送')+item('排队','delivery:排队','处理中排队；已排队消息仍可单独操作'),'输入选项');break;
case 'references':show(type,'<p>只选择其他已有会话。发送时冻结可用摘要或有界近期消息。</p><input id="query" aria-label="搜索可引用会话" placeholder="搜索会话标题"><div id="results"></div>','引用其他会话');results('');break;
case 'experts':show(type,'<p>选中后用于当前会话的后续输入；不授予工具权限。</p>'+item('默认助手','expert:none',!S.expert?'当前选择':'不使用专家指令')+S.experts.map(e=>item((S.expert?.id===e.id&&S.expert.name===e.name&&S.expert.body===e.body?'✓ ':'')+e.name,'expert:'+e.id,e.body)).join('')+(S.experts.length?'':'<div class="empty">还没有已保存的专家</div>')+item('在应用设置中管理专家','manage','创建、导入、编辑已有专家'),'选择专家');break;
case 'plugins':S.candidate=[...S.plugins];show(type,'<p>选择供当前会话使用的插件。具体操作仍按原有规则授权。</p>'+['浏览器','资料助手'].map(n=>`<label class="item"><input style="width:auto" type="checkbox" data-plugin="${n}" ${S.candidate.includes(n)?'checked':''}> ${n}<small>已就绪</small></label>`).join('')+item('团队文档 · 待登录','setup','需要登录后才能选择，不自动开启')+'<div id="plugin-note"></div>','选择插件','<button data-action="close">取消</button><button class="primary" data-action="plugins-save">应用到当前会话</button>');break;
case 'skills':show(type,'<p>加入当前消息，不立即执行。</p>'+item('资料整理','skill:资料整理')+item('代码审查','skill:代码审查'),'使用技能');break;
case 'voice':show(type,'<p>正在录音…</p><p>停止后转为文字，仍需你确认发送。原草稿保留。</p>','语音输入','<button data-action="close">取消</button><button class="primary" data-action="open:voice-finishing">停止并识别</button>');break;
case 'voice-finishing':show(type,'<p role="status">正在识别…</p>','语音输入','<button data-action="close">取消</button><button data-action="open:voice-result">模拟识别成功</button><button data-action="open:voice-error">模拟失败 / 空结果</button>');break;
case 'voice-error':show(type,'<p role="alert">未获得识别文字，原草稿保留。</p>','语音输入','<button data-action="close">取消</button><button class="primary" data-action="open:voice">重新录制</button>');break;
case 'voice-result':$('#draft').value += ' 这是一段模拟转写，可编辑后发送。';close();break;
case 'context':show(type,'<p>占用约 15360 / 128000 token。示例数据，真实产品读取当前用量。</p>','上下文使用情况');break;
case 'settings':show(type,'<p>全局管理；返回后保留当前消息草稿。</p>'+item('专家','open:expert-library','创建、导入、编辑与管理')+item('记忆','info:全局记忆开关、自动写入策略和记忆内容管理','全局记忆、自动写入与内容管理')+item('模型与连接','info:保留现有模型来源设置')+item('插件管理','info:安装、配置与认证')+item('输出与执行预算','info:全局预算设置，不在会话输入选项重复')+item('Agent 默认行为','info:仅影响新会话默认值'),'应用设置');break;
case 'expert-library':show(type,'<p>管理可在会话中选择的专家，不自动改变当前会话。</p>'+S.experts.map(e=>item(e.name,'edit:'+e.id,e.body)).join('')+item('创建专家','edit:new')+item('导入专家','open:import-expert','粘贴 JSON 示例，不访问文件系统'),'设置 / 专家',S.returnTo?'<button data-action="return-experts">返回选择专家</button>':'');break;
case 'import-expert':show(type,'<label>专家 JSON<textarea class="editor" id="expert-json" rows="6">{ "name": "文档校对员", "instruction": "检查措辞和事实来源。" }</textarea></label><div id="form-error" class="error" role="alert"></div>','导入专家','<button data-action="open:expert-library">取消</button><button class="primary" data-action="import">导入</button>');break;
case 'session':show(type,'<p>仅影响当前会话。</p>'+item('Chat 模式工具开关','info:仅在 Chat 模式下由用户明确开启或关闭，不修改工具权限或全局默认值')+item('独立技能开关','info:会话设置中管理技能启用；加号只选择已启用技能')+item('项目归属与工作目录','info:保留原目录与项目映射，不搬动文件')+item('会话权限','info:沿用会话权限配置，不授权具体调用')+item('会话能力','open:plugins')+item('专家选择','open:experts')+'<p>全局记忆配置位于应用设置；项目记忆位于项目设置。</p>','会话设置');break;
case 'nav':show(type,item('全部会话','open:switch')+item('应用设置','open:settings'),'导航');break;
case 'switch':show(type,item('整理产品接入方案','switch:current')+item('另一项工作','switch:other'),'切换会话');break;
case 'knowledge':show(type,'<p>沿用知识库资料选择，不在这里配置记忆。</p>'+item('权限与取消说明','material:知识库 · 权限与取消说明'),'引用知识库');break;
case 'model':show(type,'<p>模型与推理强度在此流程共同选择，沿用原有保存与取消语义。</p>'+item('示例模型 · 推理强度：模型默认','info:推理强度选项来自当前模型元数据'),'选择模型');break;
default:show(type,'<p>本轮保留既有功能。此面板仅说明入口归属，不模拟真实执行成功。</p>',{search:'会话内搜索',model:'选择模型',voice:'语音输入',rename:'重命名会话'}[type]||type);
}}
function results(q){const target=$('#results');if(!target)return;if(S.directory!=='ready'){target.innerHTML={loading:'<div class="empty" role="status">正在读取已有会话…</div>',empty:'<div class="empty">没有其他已有会话</div>',error:'<div class="empty error">会话读取失败</div>'+item('重试','retry')}[S.directory];return}const rows=S.sessions.filter(r=>r.id!==S.session&&r.name.includes(q));target.innerHTML=rows.map(r=>item(r.name,'reference:'+r.id,r.kind.includes('已归档')?'已归档':'')).join('')||'<div class="empty">没有匹配的会话，试试其他关键词。</div>'}
function editExpert(id){const e=S.experts.find(e=>e.id===id);S.editId=id;show('edit-expert',`<label>名称<input id="expert-name" value="${esc(e?.name||'')}"></label><label>行为指令<textarea class="editor" id="expert-body" rows="5">${esc(e?.body||'')}</textarea></label><div id="form-error" class="error" role="alert"></div>`,'设置 / '+(e?'编辑专家':'创建专家'),'<button data-action="open:expert-library">取消</button><button class="primary" data-action="expert-save">保存到专家库</button>')}
function saveExpert(name,body){if(!name.trim()||!body.trim()||name.length>80||body.length>8192||name.includes('\u0000')||body.includes('\u0000')){$('#form-error').textContent='请填写有效的名称和指令（名称最多 80 字符，指令最多 8192 字符）。';return}const id=S.editId==='new'||!S.editId?'saved-'+S.nextExpertId++:S.editId;const e={id,name:name.trim(),body:body.trim()};S.experts=S.experts.filter(x=>x.id!==id).concat(e);S.editId=null;open('expert-library')}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.open){S.origin=b;open(b.dataset.open);return}const [a,...bits]=(b.dataset.action||'').split(':'),v=bits.join(':');switch(a){case 'open':open(v);break;case 'close':close();break;case 'info':show('info','<p>'+esc(v)+'</p>','现有功能入口');break;case 'material':S.attachment=v;close();chips();break;case 'reference':S.reference=S.sessions.find(r=>r.id===v);close();chips();break;case 'expert':S.expert=S.experts.find(x=>x.id===v)||null;close();chips();break;case 'remove':S[v]=['plugins','skills'].includes(v)?[]:null;chips();break;case 'skill':S.skills=[v];close();chips();break;case 'delivery':$('#status').textContent='投递方式 · '+v;close();break;case 'plugins-save':S.plugins=[...S.candidate];close();chips();break;case 'setup':$('#plugin-note').innerHTML='<div class="notice">团队文档需要先登录。当前选择尚未保存。</div>'+item('前往插件配置','info:从插件选择进入登录，取消后回到原插件选择；不自动选中');break;case 'manage':S.returnTo='experts';open('expert-library');break;case 'return-experts':S.returnTo=null;open('experts');break;case 'edit':editExpert(v);break;case 'expert-save':saveExpert($('#expert-name').value,$('#expert-body').value);break;case 'import':try{if($('#expert-json').value.length>65536)throw Error();const x=JSON.parse($('#expert-json').value);if(!x||Array.isArray(x)||Object.keys(x).sort().join(',')!=='instruction,name')throw Error();if(typeof x.name!=='string'||typeof x.instruction!=='string')throw Error();S.editId='new';saveExpert(x.name,x.instruction)}catch{$('#form-error').textContent='请输入包含 name 和 instruction 字符串的 JSON。'}break;case 'retry':S.directory='ready';results($('#query').value);break;case 'switch':S.buffers[S.session]={draft:$('#draft').value,reference:S.reference,expert:S.expert,plugins:[...S.plugins],skills:[...S.skills],attachment:S.attachment};S.session=v;const restored=S.buffers[v]||{draft:'',reference:null,expert:null,plugins:[],skills:[],attachment:null};Object.assign(S,restored);$('#draft').value=restored.draft;close();chips();$('#status').textContent='已切换示例会话；选中状态没有带入另一会话。';break}});
document.addEventListener('input',e=>{if(e.target.id==='query')results(e.target.value)});document.addEventListener('change',e=>{if(e.target.dataset.plugin){const n=e.target.dataset.plugin;S.candidate=S.candidate.filter(x=>x!==n);if(e.target.checked)S.candidate.push(n)}if(e.target.id==='directory-state'){S.directory=e.target.value;if(S.modal==='references')results($('#query').value)}});document.addEventListener('keydown',e=>{if(e.key==='Escape')close();if(e.key==='Tab'&&S.modal){const xs=[...$('#overlay').querySelectorAll('button,input,textarea,select')].filter(x=>!x.disabled);if(e.shiftKey&&document.activeElement===xs[0]){e.preventDefault();xs.at(-1)?.focus()}else if(!e.shiftKey&&document.activeElement===xs.at(-1)){e.preventDefault();xs[0]?.focus()}}});$('#theme').onclick=()=>document.body.classList.toggle('dark');$('#send').onclick=()=>{$('#status').textContent='这是原型，未创建 Turn，也没有发送。'};chips();
</script></body></html>
