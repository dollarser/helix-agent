<style>
:root{font:16px/1.5 system-ui,sans-serif;color:#25352f;background:#eef1ed;--paper:#fff;--muted:#65746d;--line:#dbe3db;--green:#28684e;--soft:#edf5ef}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer;min-height:48px;border:0;border-radius:12px;background:transparent;color:inherit;padding:10px 14px;text-align:left}button:hover{background:var(--soft)}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #71a98d;outline-offset:2px}button:disabled{opacity:.5;cursor:default}.review{padding:18px 28px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:20px}.review p{margin:2px 0;font-size:13px;color:var(--muted)}.layout{display:grid;grid-template-columns:minmax(220px,300px) minmax(320px,540px);gap:40px;justify-content:center;padding:32px 18px}.notes h1{font-size:28px;letter-spacing:-1px}.notes p{color:var(--muted)}.notes button{display:block;width:100%;border-bottom:1px solid var(--line);border-radius:0}.phone{background:var(--paper);border:1px solid var(--line);border-radius:24px;height:780px;max-height:calc(100dvh - 140px);min-height:560px;display:flex;flex-direction:column;position:relative;overflow:hidden;box-shadow:0 12px 35px #233f3010}.top{display:flex;align-items:center;padding:12px 8px;border-bottom:1px solid var(--line)}.grow{flex:1;min-width:0}.top strong{font-size:16px}.top small{display:block;color:var(--muted);font-size:12px}.messages{flex:1;padding:24px;overflow:auto}.bubble{padding:14px 18px;border-radius:18px;background:var(--soft);margin:16px 0 24px 30px}.answer{margin:20px 0;color:#3d5145}.composer{padding:12px 14px 18px;border-top:1px solid var(--line)}.row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.scope{font-size:12px;color:var(--muted)}.composer textarea{width:100%;resize:vertical;border:0;outline:0;padding:12px 6px;min-height:60px;max-height:150px;background:transparent}.box{border:1px solid var(--line);border-radius:18px;padding:6px}.primary{background:var(--green);color:white}.primary:hover{background:#20573f}.chip{background:var(--soft);border:1px solid var(--line);font-size:12px;min-height:36px;padding:5px 10px}.overlay{position:absolute;inset:0;background:#15251e44;display:flex;align-items:flex-end}.overlay[hidden]{display:none}.sheet{background:var(--soft);border-radius:22px 22px 0 0;width:100%;max-height:92%;overflow:auto;padding:12px 18px 22px;box-shadow:0 -8px 40px #15251e18}.reference-search{position:sticky;top:0;background:var(--soft);padding-top:4px;z-index:1}.sheet h2{font-size:20px;margin:6px 0}.sheet header{display:flex;align-items:center;justify-content:space-between;gap:12px}.sheet p{color:var(--muted);font-size:14px;margin:6px 0 18px}.item{width:100%;display:block;border:0;border-radius:12px;margin:2px 0;min-height:56px;padding:10px 12px}.item strong,.item small{display:block}.item small{color:var(--muted);font-size:12px}.group{margin:18px 0 6px;font-size:12px;color:var(--muted)}input,select,textarea.editor{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:inherit;margin:5px 0 10px}label{display:block;font-size:14px}.footer{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.notice{padding:12px;background:var(--soft);border-radius:12px;margin:12px 0;font-size:13px}.error{color:#a03b32!important}.empty{padding:28px 12px;text-align:center;color:var(--muted)}.status{font-size:12px;color:var(--green);min-height:18px;margin:6px}.dark{--paper:#1b2922;--muted:#a2b3a6;--line:#394b40;--green:#327653;--soft:#273c30;color:#e2ece3;background:#111b16}.dark .answer{color:#c3d5c8}@media(max-width:740px){.layout{display:block;padding:12px}.notes{display:none}.phone{max-height:none;height:calc(100dvh - 120px);min-height:520px;max-width:480px;margin:auto}.review{padding:10px 16px;font-size:14px}.review p{max-width:240px}.review button{padding:8px}}
.plugin-status{min-width:0;display:flex;justify-content:flex-end}.plugin-status button{min-width:48px;min-height:48px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}@media(max-width:380px){.composer>.row:first-child{flex-wrap:wrap}.plugin-status{flex-basis:100%;order:-1;justify-content:flex-start}}

<div class="review"><div><strong>HELIX / 会话操作入口</strong><p>交互原型 · 合成数据 · 不执行真实操作</p></div><button id="theme">切换明暗</button></div>
<div class="layout"><aside class="notes"><h1>入口跟着任务走。</h1><p>添加材料、选择能力、调整运行、管理会话，各有明确位置。</p><button data-open="add">＋ 添加与引用</button><button data-open="top">顶部 ⋮ 会话管理</button><button data-open="run">输入区 ⋮ 输入选项</button><button data-open="capabilities">插件与专家</button><button data-open="settings">应用设置</button><button data-open="directory-sync">文件 · 文件夹双向同步</button><p>建议走一遍：会话引用 → 选择专家 → 选择插件。再试取消、搜索无结果、待配置插件和管理专家后返回。</p><label>引用目录状态<select id="directory-state"><option value="ready">正常 · 有已有会话</option><option value="loading">正在加载</option><option value="empty">没有其他会话</option><option value="error">读取失败</option></select></label></aside>
<section class="phone" aria-label="会话原型"><header class="top"><button data-open="nav" aria-label="打开导航">☰</button><div class="grow"><strong>整理产品接入方案</strong><small>当前会话</small></div><button data-open="search" aria-label="会话内搜索">⌕</button><button data-open="top" aria-label="会话管理">⋮</button></header><div class="messages"><span class="scope">今天 · 示例会话</span><div class="bubble">把之前的研究和这份方案一起核对。</div><div class="answer">可以添加需要参考的材料，再选择适合这项工作的专家与插件。<span aria-label="行内公式示例">能量 <math><mi>E</mi><mo>=</mo><mi>m</mi><msup><mi>c</mi><mn>2</mn></msup></math></span><button class="chip" data-open="citation">来源 · 合成 PDF 第 2 页</button><button class="chip" data-open="metrics">运行详情</button><button class="chip" data-open="formula-preview">查看公式 · 合成示例</button><section aria-label="图表预览"><div id="diagram-inline-picture"><svg viewBox="0 0 260 70" role="img" aria-label="合成流程图"><rect x="5" y="10" width="85" height="45" rx="8" fill="none" stroke="currentColor"/><text x="20" y="38" fill="currentColor">合成输入</text><path d="M95 33H155m-7-5 7 5-7 5" fill="none" stroke="currentColor"/><rect x="165" y="10" width="85" height="45" rx="8" fill="none" stroke="currentColor"/><text x="180" y="38" fill="currentColor">安全结果</text></svg></div><pre id="diagram-inline-source" hidden>flowchart TD
 A[合成输入] --&gt; B[安全结果]</pre><button data-action="diagram-source">源码 / 预览</button><button data-action="diagram-copy">复制源码</button><button data-open="diagram-preview">放大</button></section><section aria-label="SVG 预览"><div id="svg-inline-picture"><svg viewBox="0 0 200 70" role="img" aria-label="静态 SVG 示例"><rect x="8" y="8" width="184" height="54" rx="8" fill="#2277dd"/><text x="48" y="42" fill="white">合成 SVG</text></svg></div><pre id="svg-inline-source" hidden>&lt;svg viewBox="0 0 200 70"&gt;…&lt;/svg&gt;</pre><button data-action="svg-source">源码 / 预览</button><button data-action="diagram-copy">复制源码</button></section></div></div><div class="composer"><div class="row"><span class="scope">Act · 按需询问</span><span id="plugin-status" class="grow plugin-status"></span><button data-open="context" aria-label="上下文占用 12%">◔ 12%</button><button data-open="run" aria-label="输入选项">⋮</button></div><div id="chips" class="row"></div><div class="box"><textarea id="draft" aria-label="消息草稿" placeholder="发消息…">重点看看返回链和权限边界。</textarea><div class="row"><button data-open="add" aria-label="添加到消息">＋</button><button data-open="model">示例模型 ⌄</button><span class="grow"></span><button data-open="voice" aria-label="语音输入">♩</button><button id="send" class="primary" aria-label="发送演示消息">↑</button></div></div><div id="status" class="status" role="status"></div></div><div id="overlay" class="overlay" hidden></div></section></div>
<script>
'use strict';
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const S={session:'current',draft:'',reference:null,expert:null,plugins:[],skills:[],attachment:null,returnTo:null,experts:[{id:'android',name:'Android 工程师',body:'检查 Android 生命周期与权限边界。'},{id:'research',name:'产品研究员',body:'区分事实与建议，保留来源。'}],sessions:[{id:'permissions',name:'Android 权限研究',count:24,kind:'按需读取',date:'昨天'},{id:'cancel',name:'取消与恢复设计',count:24,kind:'按需读取',date:'10 月 25 日'},{id:'archive',name:'输入体验复盘',count:8,kind:'按需读取 · 已归档',date:'10 月 22 日'},{id:'empty',name:'待整理的会话',count:0,kind:'暂无可读消息',date:'今天'}],directory:'ready',modal:null,candidate:[],origin:null,buffers:{},nextExpertId:1};
const item=(title,action,sub='')=>`<button class="item" data-action="${action}"><strong>${esc(title)}</strong>${sub?`<small>${esc(sub)}</small>`:''}</button>`;
function show(type,body,title,foot=''){S.modal=type;$('#overlay').hidden=false;$('#overlay').innerHTML=`<section class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><header><h2>${esc(title)}</h2><button data-action="close" aria-label="关闭面板">×</button></header>${body}${foot?`<div class="footer">${foot}</div>`:''}</section>`;$('#overlay button')?.focus()}
function close(){S.modal=null;$('#overlay').hidden=true;$('#overlay').innerHTML='';S.origin?.focus()}
function chips(){const effective=[...new Set(S.plugins.concat((S.expert?.plugins||[]).map(id=>EXPERT_PLUGIN_OPTIONS.find(x=>x[0]===id)?.[1]).filter(Boolean)))];$('#plugin-status').innerHTML=effective.length?`<button class="chip" data-action="open:plugins" title="${esc(effective.join('、'))}">插件 · ${esc(effective.join('、'))}</button>`:'';const entries=[['reference',S.reference&&'引用 · '+S.reference.name],['expert',S.expert&&'专家 · '+S.expert.name],['skills',S.skills.length&&'技能 · '+S.skills.join('、')],['attachment',S.attachment]];$('#chips').innerHTML=entries.filter(x=>x[1]).map(([k,v])=>`<button class="chip" data-action="${k==='expert'?'open:experts':k==='plugins'?'open:plugins':'remove:'+k}" aria-label="${k==='expert'||k==='plugins'?'调整':'移除'}${esc(v)}">${esc(v)} ${k==='expert'||k==='plugins'?'⌄':'×'}</button>`).join('')}
function open(type){switch(type){
case 'add':show(type,'<div class="group">材料</div>'+item('拍照','material:示例照片.jpg')+item('照片','material:示例图片.png')+item('文件','material:接入方案.pdf')+item('连续转写','open:continuous-voice','停顿后追加可编辑草稿，不自动发送')+item('引用其他会话','open:references','加入当前消息；模型按需读取所选版本')+item('引用知识库','open:knowledge')+'<div class="group">已有能力</div>'+item('选择专家','open:experts',(S.expert?.name||'默认助手')+' · 当前会话后续输入')+item('选择插件','open:plugins',(S.plugins.join('、')||'未选择')+' · 当前会话')+item('使用技能','open:skills','只加入当前消息，不立即执行'),'添加到消息');break;
case 'top':show(type,'<p>管理整个当前会话。</p>'+item('会话设置','open:session','项目、工作目录、会话权限与上下文策略')+item('重命名','open:rename')+item('导出会话','info:保留现有导出流程')+item('当前任务与成果','info:保留任务、Goal、成果与中断恢复入口')+item('Git 状态','info:保留当前工作目录的 Git 入口')+'<p>归档与删除保留在全部会话列表中。</p>','会话管理');break;
case 'run':show(type,'<p>只控制消息的投递方式。</p>'+item('立即发送','delivery:立即发送','处理中按此方式发送新消息；空闲时正常发送')+item('排队','delivery:排队','处理中排队；已排队消息仍可单独操作'),'输入选项');break;
case 'references':show(type,'<p>分享固定版本，模型可在本会话按需检索和读取。</p><div class="reference-search"><input id="query" aria-label="搜索可引用会话" placeholder="搜索会话标题"></div><div id="results"></div>','引用其他会话');results('');break;
case 'experts':show(type,'<p>选中后用于当前会话的后续输入；不授予工具权限。</p>'+item('默认助手','expert:none',!S.expert?'当前选择':'不使用专家指令')+S.experts.map(e=>item((S.expert?.id===e.id&&S.expert.name===e.name&&S.expert.body===e.body?'✓ ':'')+e.name,'expert:'+e.id,(e.description||e.body)+(e.plugins?.length?' · 关联 '+e.plugins.length+' 个插件':''))).join('')+(S.experts.length?'':'<div class="empty">还没有已保存的专家</div>')+item('管理插件与专家','manage','创建、导入、编辑已有专家'),'选择专家');break;
case 'plugins':S.candidate=[...S.plugins];show(type,'<p>选择供当前会话使用的插件。具体操作仍按原有规则授权。</p>'+['浏览器','资料助手'].map(n=>`<label class="item"><input style="width:auto" type="checkbox" data-plugin="${n}" ${S.candidate.includes(n)?'checked':''}> ${n}<small>已就绪</small></label>`).join('')+item('团队文档 · 待登录','setup','需要登录后才能选择，不自动开启')+'<div id="plugin-note"></div>','选择插件','<button data-action="close">取消</button><button class="primary" data-action="plugins-save">应用到当前会话</button>');break;
case 'skills':show(type,'<p>加入当前消息，不立即执行。</p>'+item('资料整理','skill:资料整理')+item('代码审查','skill:代码审查'),'使用技能');break;
case 'continuous-voice':show(type,'<p id=continuous-state>正在连续转写… 停顿后追加到草稿。</p><p>取消只丢弃未完成段；修改草稿会结束录音。</p>','连续转写','<button data-action="close">取消</button><button data-action="continuous-pause">模拟停顿追加</button>');break;
case 'voice':show(type,'<p>正在录音…</p><p>停止后转为文字，仍需你确认发送。原草稿保留。</p>','语音输入','<button data-action="close">取消</button><button class="primary" data-action="open:voice-finishing">停止并识别</button>');break;
case 'voice-finishing':show(type,'<p role="status">正在识别…</p>','语音输入','<button data-action="close">取消</button><button data-action="open:voice-result">模拟识别成功</button><button data-action="open:voice-error">模拟失败 / 空结果</button>');break;
case 'voice-error':show(type,'<p role="alert">未获得识别文字，原草稿保留。</p>','语音输入','<button data-action="close">取消</button><button class="primary" data-action="open:voice">重新录制</button>');break;
case 'voice-result':$('#draft').value += ' 这是一段模拟转写，可编辑后发送。';close();break;
case 'diagram-preview':show(type,'<svg viewBox="0 0 260 70" role="img" aria-label="合成流程图"><rect x="5" y="10" width="85" height="45" rx="8" fill="none" stroke="currentColor"/><text x="20" y="38" fill="currentColor">合成输入</text><path d="M95 33H155m-7-5 7 5-7 5" fill="none" stroke="currentColor"/><rect x="165" y="10" width="85" height="45" rx="8" fill="none" stroke="currentColor"/><text x="180" y="38" fill="currentColor">安全结果</text></svg><p>App 离线渲染；图内链接与配置不执行。原始源码可复制，失败保留源码。</p>','图表');break;
case 'formula-preview':show(type,'<math display=block><mfrac><mn>1</mn><mn>2</mn></mfrac></math><p>原始公式保留在消息中；App 离线排版，不加载远端资源。不支持的语法显示源码。</p>','公式');break;
case 'metrics':show(type,'<p>本轮 2 次模型请求 · 1 条工具调用记录</p><h3>请求 1</h3><p>首次响应 0.30 秒 · 首字 — · 请求耗时 1.20 秒<br>输入 / 输出 Token：800 / 40</p><h3>请求 2</h3><p>首字 0.45 秒 · 请求耗时 2.50 秒<br>输入 / 输出 Token：950 / 120</p><p class=scope>合成示例。客户端计时；速率按报告输出 Token / 请求总耗时计算。— 表示未记录或未报告。</p>','运行详情');break;
case 'context':show(type,'<p>占用约 15360 / 128000 token。示例数据，真实产品读取当前用量。</p>','上下文使用情况');break;
case 'automation-review':show(type,'<p>合成定时任务：核对资料</p><p class=scope>外部链接仅打开此审阅页，不执行模型请求。编辑后仍须确认模型和工具范围。</p>'+item('编辑任务','info:进入现有定时任务编辑器；取消不保存'),'审阅定时任务');break;
case 'directory-sync':show(type,'<p>应用私有文件夹 ↔ 已授权 SAF 文件夹，默认暂停。</p><label>私有文件夹<input value="work/demo"></label><label>已授权 SAF 文件夹<input value="示例文件夹"></label><p id=sync-state role=status>已暂停</p><p>双方修改、类型变化或删除暂停；不自动传播删除。自动运行最短15分钟，可能延后。</p>','文件夹双向同步','<button data-action="sync-enable">开启自动同步</button><button data-action="sync-run">模拟立即同步</button><button data-action="sync-conflict">模拟冲突</button>');break;
case 'backup':show(type,'<p>默认备份聊天、附件、记忆、专家与 Skills、配置和任务历史。</p><label><input type=checkbox> 知识库、笔记及资料原件</label><label><input type=checkbox> 工作区文件</label><label><input type=checkbox> 加密备份 API 密钥与连接器凭据</label><p class=scope>凭据默认不导出；启用后设置备份密码。普通聊天与配置为明文，请妥善保管。账号和系统授权需重新登录、授权。</p>'+item('导出备份','info:系统选择 ZIP 保存位置')+item('选择备份恢复','info:先完整校验并预览范围；明确替换本机私有配置，公共文件冲突时拒绝。任务恢复后暂停，不重放运行。确认后关闭应用，重新打开完成事务；失败回滚。'),'应用备份与恢复');break;
case 'library-settings':show(type,'<p id="semantic-progress">'+esc(S.semanticProgress||'语义索引未开启；失败或降级时可重试。')+'</p>'+item('Agent 访问知识库','info:独立开关；明确引用不需要开放全库')+item('语义检索','open:semantic'),'知识库 · 设置');break;
case 'semantic':show(type,'<p>仅为所选资料建立本机可重建索引。资料文本和查询会发送至已登录账号的嵌入服务；不开放未选资料或整个知识库。</p><label>嵌入模型<select><option>Qwen/Qwen3-Embedding-0.6B</option></select></label><label><input type="checkbox" checked> 合成资料 · 港口记录</label><label><input type="checkbox"> 合成笔记 · 山地记录</label><details><summary>模型参数</summary><label>查询前缀<input maxlength="512"></label><label>资料前缀<input maxlength="512"></label><label>部署修订标识<input maxlength="200"></label></details>','语义检索','<button data-action="open:library-settings">取消</button><button class="primary" data-action="semantic-enable">启用并建立索引</button>');break;
case 'audit':show(type,item('搜索命令输出','open:command-output')+item('搜索应用日志','open:app-log')+'<p class=scope>只搜索可显示的脱敏字段，不搜索参数、输出正文或凭据。</p><input id="audit-query" maxlength="256" aria-label="日志关键词" placeholder="工具名、会话 ID、结果码；试试 needle42"><div id="audit-results"></div>','历史日志搜索');auditResults('');break;

case 'workspace':show(type,'<p>已授权最大范围优先；可选共享存储根目录。Android 10 使用存储读写权限，Android 11+ 在系统设置管理所有文件访问。权限和范围由用户控制。</p>'+item('管理本地文件访问','info:仅由用户进入系统授权；取消或拒绝不改变原目录')+item('示例真实目录','open:workspace-path')+item('示例授权文档目录','open:workspace-saf')+'<p>取消不改变会话目录，不复制文件。</p>','工作目录','<button data-action="open:session">取消</button>');break;
case 'workspace-path':show(type,'<p>已实际打开原目录。Linux Runtime 可用并获准后映射为 /workspace，不复制工作副本。</p><p>来源声明可写；具体操作仍核验当前权限与原目录身份。源码原位，构建可显式使用私有 HELIX_BUILD_DIR，不自动改项目。</p>','示例真实目录','<button data-action="open:workspace">取消</button><button data-action="info:原型示例已选目录；没有复制文件">选择此目录</button>');break;

case 'session':show(type,'<p>仅影响当前会话。</p>'+item('Chat 模式工具开关','info:仅在 Chat 模式下由用户明确开启或关闭，不修改工具权限或全局默认值')+item('独立技能开关','info:会话设置中管理技能启用；加号只选择已启用技能')+item('项目归属','info:保留原项目映射')+item('工作目录','open:workspace')+item('会话权限','info:沿用会话权限配置，不授权具体调用')+item('会话能力','open:plugins')+item('专家选择','open:experts')+'<p>全局记忆配置位于应用设置；项目记忆位于项目设置。</p>','会话设置');break;
case 'command-output':show(type,'<p>检索已核验留存的标准输出与错误输出，不启动命令。缺失和截断范围另作提示。</p><label>关键词<input placeholder=合成标记></label><button data-action=info:本页合成匹配>搜索命令输出</button><p>本页检查 50 条命令，找到 1 条匹配。</p>'+item('Synthetic marker: PIPE_CLOSED','info:打开原命令详情，不重新执行')+item('继续检索更早历史','info:按时间和身份分页，不将无匹配当全库无结果'),'搜索命令输出');break;case 'app-log':show(type,'<p>仅当前 Helix 进程近期 logcat；不含其他 App、旧进程或全设备历史。已知凭据先遮蔽再匹配。</p><label>关键词<input placeholder=合成标记></label><pre>HelixSynthetic: SYNTHETIC_MARKER [redacted: credential]</pre><p>快照最多 500 行／256 KiB，展示前 100 条匹配。</p>','搜索应用日志');break;case 'nav':show(type,item('知识库设置','open:library-settings')+item('全部会话','open:switch')+item('应用设置','open:settings'),'导航');break;
case 'switch':show(type,item('整理产品接入方案','switch:current')+item('另一项工作','switch:other'),'切换会话');break;
case 'citation':show(type,'<p>合成 PDF · 第 2 页 · 字符范围 0–22</p><blockquote>PAGE_2_UNIQUE_EVIDENCE</blockquote><p class=scope>仅文本提取；不等于已查看图像或扫描文字。来源修订变化或删除后，旧片段不自动替换。</p>','来源片段');break;
case 'knowledge':show(type,'<p>选择已有知识、笔记或资料。仅附加所选版本信息，模型按需检索、分页读取；不打开整个知识库。</p>'+item('权限与取消说明','material:知识库 · 权限与取消说明'),'引用知识库');break;
case 'model':show(type,'<p>内置聊天模型直接可选，无需 API 管理勾选；未知用途暂不可选。模型与推理强度共同选择，沿用保存与取消语义。</p>'+item('示例模型 · 推理强度：模型默认','info:推理强度选项来自当前模型元数据'),'选择模型');break;
default:show(type,'<p>本轮保留既有功能。此面板仅说明入口归属，不模拟真实执行成功。</p>',{search:'会话内搜索',model:'选择模型',voice:'语音输入',rename:'重命名会话'}[type]||type);
}}
function results(q){const target=$('#results');if(!target)return;if(S.directory!=='ready'){target.innerHTML={loading:'<div class="empty" role="status">正在读取已有会话…</div>',empty:'<div class="empty">没有其他已有会话</div>',error:'<div class="empty error">会话读取失败</div>'+item('重试','retry')}[S.directory];return}const rows=S.sessions.filter(r=>r.id!==S.session&&r.name.includes(q));target.innerHTML=rows.map(r=>r.count===0?'<button class="item" disabled><strong>'+esc(r.name)+'</strong><small>暂无可读消息</small></button>':item((S.reference?.id===r.id?'✓ ':'')+r.name,'reference:'+r.id,r.date+' · '+r.count+' 条消息'+(r.kind.includes('已归档')?' · 已归档':''))).join('')||'<div class="empty">没有匹配的会话，试试其他关键词。</div>'}
function auditResults(q,more=false){if(!more)S.auditCursor=0;S.auditQuery=q.trim().toLowerCase();let i=S.auditCursor||0,n=0,rows=[];while(i<2500&&n<1000&&rows.length<200){const title=i===1499?'knowledge.read · needle42':'time.now · 合成记录 '+i;i++;n++;if(title.toLowerCase().includes(S.auditQuery))rows.push('<p>'+esc(title)+'</p>')}S.auditCursor=i;$('#audit-results').innerHTML='<p role=status>本批 '+rows.length+' 条匹配，已检查 '+n+' 条。'+(i<2500?'仍有历史可继续查找。':'已到历史末尾。')+'</p>'+rows.join('')+(i<2500?item('下一批 / 继续查找','audit-more'):'')+item('从头查询','audit-reset')}
const EXPERT_PLUGIN_OPTIONS=[['native:browser','浏览器'],['package:'+ 'b'.repeat(64),'资料助手']];
const EXPERT_SKILL_OPTIONS=[['BUILT_IN/repo-inspection/'+ 'a'.repeat(64),'资料检查']];
function dependencyChecks(options,selected,kind){return options.concat(selected.filter(x=>!options.some(y=>y[0]===x)).map(x=>[x,'缺少依赖 · '+x.slice(0,32)])).map(([id,name])=>`<label class="item"><input style="width:auto" type="checkbox" data-expert-${kind}="${esc(id)}" ${selected.includes(id)?'checked':''}> ${esc(name)}</label>`).join('')}
function editExpert(id){const e=S.experts.find(e=>e.id===id);S.editId=id;show('edit-expert',`<label>名称<input id="expert-name" value="${esc(e?.name||'')}"></label><label>简短描述<input id="expert-description" maxlength="280" value="${esc(e?.description||'')}"></label><label>行为指令<textarea class="editor" id="expert-body" rows="7">${esc(e?.body||'')}</textarea></label><h3>关联插件</h3><p>只关联已有能力，不自动安装或授予权限。</p>${dependencyChecks(EXPERT_PLUGIN_OPTIONS,e?.plugins||[],'plugin')}<h3>关联 Skills</h3>${dependencyChecks(EXPERT_SKILL_OPTIONS,e?.skills||[],'skill')}<div id="form-error" class="error" role="alert"></div>`,'插件与专家 / '+(e?'编辑专家':'创建专家'),'<button data-action="open:expert-library">取消</button><button class="primary" data-action="expert-save">保存</button>')}
function saveExpert(name,body,description="",plugins=[],skills=[]){if(!name.trim()||!body.trim()||name.length>80||body.length>8192||name.includes('\u0000')||body.includes('\u0000')){$('#form-error').textContent='请填写有效的名称和指令（名称最多 80 字符，指令最多 8192 字符）。';return}const id=S.editId==='new'||!S.editId?'saved-'+S.nextExpertId++:S.editId;const e={id,name:name.trim(),body:body.trim(),description,plugins,skills};S.experts=S.experts.filter(x=>x.id!==id).concat(e);S.editId=null;open('expert-library')}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.open){S.origin=b;open(b.dataset.open);return}const [a,...bits]=(b.dataset.action||'').split(':'),v=bits.join(':');switch(a){case 'continuous-pause':$('#draft').value += ' 合成分段文字。';$('#continuous-state').textContent='此段已追加草稿；继续等待下一段，未发送消息。';break;case 'sync-enable':$('#sync-state').textContent='示例：已开启，等待系统调度';break;case 'sync-run':$('#sync-state').textContent='原型合成结果：已验证双向复制；未操作任何文件';break;case 'sync-conflict':$('#sync-state').textContent='双方修改冲突，已暂停；请比较并保留所需内容后重试';break;case 'diagram-source':case 'svg-source':{const k=a==='diagram-source'?'diagram':'svg';const p=$('#'+k+'-inline-picture'),c=$('#'+k+'-inline-source');p.hidden=!p.hidden;c.hidden=!c.hidden;break}case 'diagram-copy':$('#status').textContent='已复制合成示例源码（原型演示）';break;case 'open':open(v);break;case 'close':close();break;case 'info':show('info','<p>'+esc(v)+'</p>','现有功能入口');break;case 'material':S.attachment=v;close();chips();break;case 'reference':S.reference=S.sessions.find(r=>r.id===v);close();chips();break;case 'expert':S.expert=JSON.parse(JSON.stringify(S.experts.find(x=>x.id===v)||null));close();chips();break;case 'remove':S[v]=['plugins','skills'].includes(v)?[]:null;chips();break;case 'skill':S.skills=[v];close();chips();break;case 'delivery':$('#status').textContent='投递方式 · '+v;close();break;case 'plugins-save':S.plugins=[...S.candidate];close();chips();break;case 'setup':$('#plugin-note').innerHTML='<div class="notice">团队文档需要先登录。当前选择尚未保存。</div>'+item('前往插件配置','info:从插件选择进入登录，取消后回到原插件选择；不自动选中');break;case 'manage':S.returnTo='experts';open('expert-library');break;case 'return-experts':S.returnTo=null;open('experts');break;case 'expert-config':{const e=S.experts.find(x=>x.id===v);show('expert-config','<label>配置 JSON<textarea class="editor" rows="10" readonly>'+esc(JSON.stringify({name:e.name,description:e.description||'',instruction:e.body,plugins:e.plugins||[],skills:e.skills||[]},null,2))+'</textarea></label>','导出专家配置');break;}case 'edit':editExpert(v);break;case 'expert-save':saveExpert($('#expert-name').value,$('#expert-body').value,$('#expert-description').value,[...document.querySelectorAll('[data-expert-plugin]:checked')].map(x=>x.dataset.expertPlugin),[...document.querySelectorAll('[data-expert-skill]:checked')].map(x=>x.dataset.expertSkill));break;case 'import':try{if($('#expert-json').value.length>65536)throw Error();const x=JSON.parse($('#expert-json').value);if(!x||Array.isArray(x)||!Object.keys(x).every(k=>['name','instruction','description','plugins','skills'].includes(k)))throw Error();if(typeof x.name!=='string'||typeof x.instruction!=='string')throw Error();if(x.description!==undefined&&(typeof x.description!=='string'||x.description.length>280))throw Error();for(const k of ['plugins','skills'])if(x[k]!==undefined&&(!Array.isArray(x[k])||x[k].length>32||x[k].some(v=>typeof v!=='string'||!v||v.length>512)))throw Error();S.editId='new';saveExpert(x.name,x.instruction,x.description||'',x.plugins||[],x.skills||[])}catch{$('#form-error').textContent='请输入包含 name 和 instruction 字符串的 JSON。'}break;case 'semantic-enable':S.semanticProgress='示例：已完成 1 / 2 份资料；失败或降级可重试。';close();$('#status').textContent='示例：仅更新明确选择的资料；关闭后停止发送，原文不改动。';break;case 'audit-more':auditResults($('#audit-query').value,true);break;case 'audit-reset':auditResults($('#audit-query').value);break;case 'retry':S.directory='ready';results($('#query').value);break;case 'switch':S.buffers[S.session]={draft:$('#draft').value,reference:S.reference,expert:S.expert,plugins:[...S.plugins],skills:[...S.skills],attachment:S.attachment};S.session=v;const restored=S.buffers[v]||{draft:'',reference:null,expert:null,plugins:[],skills:[],attachment:null};Object.assign(S,restored);$('#draft').value=restored.draft;close();chips();$('#status').textContent='已切换示例会话；选中状态没有带入另一会话。';break}});
document.addEventListener('input',e=>{if(e.target.id==='query')results(e.target.value);if(e.target.id==='audit-query')auditResults(e.target.value)});document.addEventListener('change',e=>{if(e.target.dataset.plugin){const n=e.target.dataset.plugin;S.candidate=S.candidate.filter(x=>x!==n);if(e.target.checked)S.candidate.push(n)}if(e.target.id==='directory-state'){S.directory=e.target.value;if(S.modal==='references')results($('#query').value)}});document.addEventListener('keydown',e=>{if(e.key==='Escape')close();if(e.key==='Tab'&&S.modal){const xs=[...$('#overlay').querySelectorAll('button,input,textarea,select')].filter(x=>!x.disabled);if(e.shiftKey&&document.activeElement===xs[0]){e.preventDefault();xs.at(-1)?.focus()}else if(!e.shiftKey&&document.activeElement===xs.at(-1)){e.preventDefault();xs[0]?.focus()}}});$('#theme').onclick=()=>document.body.classList.toggle('dark');$('#send').onclick=()=>{$('#status').textContent='这是原型，未创建 Turn，也没有发送。'};chips();
</script></body></html>
