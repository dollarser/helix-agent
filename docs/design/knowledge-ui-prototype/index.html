<header class="review"><h1>Helix · 知识与对话引用</h1><p>交互原型 · 合成内容 · 不读文件、不调用模型、不发送网络请求。新增设计尚未接入 Android。</p><div class="review-tools" id="scenes"><button data-scene="library">知识库</button><button data-scene="chat">对话中引用</button><button data-scene="distill">笔记整理为知识</button><button data-scene="history">历史引用</button><button data-scene="update">来源更新</button><button data-scene="unavailable">来源不可用</button><button data-demo="wide">宽屏</button><button data-demo="large">大字体</button><button data-demo="dark">暗色</button><button data-demo="reset">复位</button></div></header>
<div class="stage"><div class="app" id="helix-knowledge"><header class="chrome"><span class="brand">H</span><strong>Helix</strong><button data-act="chat" aria-label="打开对话">对话</button><button data-act="library" aria-label="打开知识库">知识库</button></header><div class="layout"><nav class="rail" aria-label="应用导航"><button data-act="chat">◯ 对话</button><button class="active" data-act="library">▧ 知识库</button><p class="hint">本机内容</p><p class="muted">问答记录仍在会话中。知识与笔记不会自动成为 Agent 记忆。</p></nav><main class="body" id="main"></main><aside class="overview"><h3>内容与引用</h3><p>笔记记录过程，知识沉淀结论，资料保留依据。</p><button data-act="tab:notes">打开笔记</button><button data-act="tab:knowledge">打开知识</button><button data-act="tab:sources">打开资料</button><h3 style="margin-top:28px">发送由你决定</h3><p>引用只作用于本条消息。不自动带上关联原件，也不自动开启整库检索。</p><button data-act="history-list">相关问答记录 →</button></aside></div><div class="demo-tag">原型演示 · 内容仅存在本页，刷新后复原</div><div id="modal"></div><div id="toast" class="toast hidden" role="status" aria-live="polite"></div></div></div>

{id:'k1',kind:'knowledge',title:'服务连接失败的排查方法',body:'## 先确认失败在哪一层\n\n收到服务端响应，和完全没有建立连接，是两件不同的事。先确认服务状态，再排查连接。\n\n## 保留执行边界\n\n未知结果不能当作未执行。重新检查原操作，避免重复产生副作用。',excerpt:'收到服务端响应，和完全没有建立连接，是两件不同的事。先确认服务状态，再排查连接。',reviewed:true,version:2,refs:['s1','n1'],date:'今天 10:42',ready:true},
{id:'k2',kind:'knowledge',title:'把问题变成可复用的经验',body:'## 写下可复用的判断\n\n说明适用场景、判断依据和例外，比堆积结论更有用。\n\n每条经验都应该保留它的来源。',excerpt:'说明适用场景、判断依据和例外，比堆积结论更有用。',reviewed:false,version:1,refs:['s2'],date:'昨天 18:20',ready:true},
{id:'n1',kind:'notes',title:'今天调试时记下的几个想法',body:'先查账号服务有没有响应，再看模型是否可用。\n\n有响应不等于成功；不要把所有异常都提示成用户网络问题。\n\n想整理一份下次可以直接使用的排查清单。',excerpt:'先查账号服务有没有响应，再看模型是否可用。',reviewed:false,version:1,refs:['s1'],date:'今天 09:35',ready:true},
{id:'n2',kind:'notes',title:'随手记：阅读与写作',body:'读到一个好观点时，先写下我为什么觉得有用。\n\n不必每一次记录都整理成知识，也不用为随手记标记核对状态。',excerpt:'读到一个好观点时，先写下我为什么觉得有用。',version:1,refs:[],date:'昨天 21:10',ready:true},
{id:'s1',kind:'sources',title:'服务连接说明.md',body:'## 连接与响应\n\n连接失败时，还没有收到有效响应；收到暂不可用响应时，应提示服务稍后恢复，而不是断言用户断网。\n\n## 超时\n\n超时只说明没有在时限内得到结果，不能据此断言操作未发生。',excerpt:'收到暂不可用响应时，应提示服务稍后恢复，而不是断言用户断网。',version:1,refs:[],date:'今天 09:10',ready:true,type:'Markdown 原件'},
{id:'s2',kind:'sources',title:'阅读方法与项目复盘',body:('每次复盘先写下原问题、观察和选择依据。\n').repeat(1400)+'\n重要结论：不要把总结当作原始证据。',excerpt:'每次复盘先写下原问题、观察和选择依据。重要结论：不要把总结当作原始证据。',version:3,refs:[],date:'昨天 17:00',ready:true,type:'长篇网页 · 已提取'},

function sizeDraft(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight||48,140)+'px'}
function conversationHeader(){return btn('app-nav',ic('menu'),'header-icon','aria-label="打开导航"')+btn('chat-title',history.length?'资料讨论':'新的会话','conversation-title')+btn('chat-search',ic('search'),'header-icon','aria-label="搜索会话"')+btn('new-chat',ic('newchat'),'header-icon','aria-label="新建会话"')+btn('chat-options',ic('more'),'header-icon','aria-label="会话详情"')}
function libraryHtml(){const rows=docs.filter(d=>d.kind===state.tab&&(d.title+' '+d.body).toLowerCase().includes(state.query.toLowerCase()));return '<div class="head"><div class="split"><h2>知识库</h2>'+btn('new','写笔记','secondary')+'</div><p class="sub">记下想法，再慢慢整理成自己的理解。</p><input class="search-box" data-input="search" type="search" aria-label="搜索知识库" placeholder="搜索标题或正文" value="'+esc(state.query)+'"></div><div class="tabs" role="tablist" aria-label="内容分类">'+['knowledge','notes','sources'].map(k=>btn('tab:'+k,kindLabel(k),state.tab===k?'active':'','role="tab" aria-selected="'+(state.tab===k)+'"')).join('')+'</div><div class="scroll"><div class="list-top split"><span class="muted">最近更新 · '+rows.length+' 篇</span>'+btn('history-list','问答记录 →','muted')+'</div><div class="list">'+(rows.length?rows.map(d=>'<article class="item"><span class="icon">'+ic(d.kind==='knowledge'?'book':d.kind==='notes'?'note':'source')+'</span><button class="open" data-act="open:'+d.id+'"><h3>'+esc(d.title)+'</h3><p>'+esc(d.body.slice(0,100)||'原件已保存，尚无可用正文')+'</p><span class="item-meta"><span>'+esc(d.date)+'</span>'+(d.kind==='knowledge'?'<span class="pill '+(d.reviewed?'good':'')+'">'+(d.reviewed?'已核对':'未标记核对')+'</span>':d.kind==='sources'?'<span>'+esc(d.type)+'</span>':'<span>已保存</span>')+(d.refs.length?'<span>'+d.refs.length+' 个来源</span>':'')+'</span></button>'+btn('quote:'+d.id,ic('link'),'','aria-label="引用'+esc(d.title)+'" '+(!d.ready?'disabled':''))+'</article>').join(''):'<div class="empty"><h3>没有匹配内容</h3><p>试试其他关键词，或先写下一条笔记。</p>'+btn('clear-search','清除搜索','secondary')+'</div>')+'</div></div><footer class="foot row">'+btn('new',ic('plus')+' 写笔记','primary')+btn('create-knowledge','直接写知识','secondary')+btn('import','导入资料')+'</footer>'}
function readHtml(){const d=get(state.id);if(!d)return libraryHtml();if(state.editing)return '<div class="head split">'+btn('leave-edit',ic('back'),'','aria-label="返回"')+'<strong>'+kindLabel(d.kind)+' · 编辑</strong>'+btn('save-edit','保存','primary')+'</div><div class="scroll editor"><label><span class="muted">标题</span><input data-input="edit-title" aria-label="标题" value="'+esc(state.editTitle)+'"></label><label><span class="muted">Markdown 正文 · 修改尚未保存</span><textarea data-input="edit-body" aria-label="Markdown 正文">'+esc(state.editBody)+'</textarea></label></div><footer class="foot"><span class="muted">保存笔记不等于核对，也不会自动发送给模型。</span></footer>';
return '<div class="head split">'+btn('library',ic('back'),'','aria-label="返回知识库"')+'<span class="muted">'+kindLabel(d.kind)+' · v'+d.version+'</span>'+btn('more','更多')+'</div><div class="scroll"><article class="read"><h2>'+esc(d.title)+'</h2><div class="row muted"><span>'+esc(d.date)+'</span>'+(d.kind==='knowledge'?btn('review',d.reviewed?'✓ 已核对':'标记已核对','pill '+(d.reviewed?'good':'')):'<span>已保存</span>')+'</div>'+(d.body?renderMd(d.body.length>4500?d.body.slice(0,1500)+'\n\n（原型阅读页折叠长文；引用预览中可切换全文）':d.body):'<div class="callout warn">原件已保存，但没有可供文字引用的正文。视觉理解须在 Android 中另行明确选择，本次引用不可用。</div>')+(d.refs.length?'<h3>来源</h3>'+d.refs.map(id=>{const frozen=d.sourceSnapshots?.find(r=>r.id===id),s=frozen||get(id);return s?btn('source:'+id,ic('source')+' '+esc(s.title)+(frozen?' · 引用时 v'+frozen.version:''),'source-link'):''}).join(''):'')+'</article></div><footer class="foot row">'+btn('ask:'+d.id,'基于此内容提问','primary',''+(!d.ready?'disabled':''))+(d.kind!=='sources'?btn('edit','编辑','secondary'):'')+(d.kind!=='knowledge'?btn('distill:'+d.id,'整理为知识','',''+(!d.ready?'disabled':'')):'')+'</footer>'}
function chatHtml(){return '<div class="scroll chat">'+(history.length?history.map((m,i)=>'<div class="bubble">'+esc(m.question)+'<div class="history-refs">'+m.refs.map((r,j)=>btn('history-ref:'+i+':'+j,ic('link')+' '+esc(r.title)+' · v'+r.version)).join('')+'</div></div><article class="answer"><span class="pill">演示回答 · 非模型生成</span><p>'+esc(m.answer)+'</p>'+(m.refs.length?btn('history-ref:'+i+':0','[1] 查看当时引用','pill'):'')+'<div class="message-actions">'+btn('save-answer:'+i,'保存为笔记')+btn('message-options','消息操作')+'</div></article>').join(''):'<div class="welcome"><div class="brand">H</div><h2>今天想让我做什么？</h2><p class="sub">在下方输入问题或任务，也可以先添加附件。</p>'+btn('picker','引用知识库中的内容','prompt')+btn('suggestion','帮我梳理一下这个问题','prompt')+'</div>')+'</div><div class="composer-wrap"><div class="composer-toolbar" aria-label="会话输入工具栏"><span class="mode-caption">执行</span>'+btn('permission-info','标准 ▾')+btn('context-info','上下文','context-action')+btn('composer-options',ic('more'),'option-action','aria-label="输入选项"')+'</div>'+(state.refs.length?'<div class="context-label">本条附带 · '+state.refs.length+' 项 · '+total(state.refs).toLocaleString()+' 字符</div>':'')+'<div class="composer"><div class="refs">'+state.refs.map((r,i)=>'<span class="ref"><button data-act="ref:'+i+'">'+esc(r.title)+(r.stale?' · 已更新':r.unavailable?' · 不可用':'')+'</button><button data-act="remove:'+i+'" aria-label="移除'+esc(r.title)+'">×</button></span>').join('')+'</div><textarea data-input="draft" rows="1" aria-label="消息输入框" placeholder="输入消息…">'+esc(state.draft)+'</textarea><div id="send-status" class="status-line">'+sendIssue()+'</div><div class="composer-bottom">'+btn('add-menu',ic('plus'),'add-action','aria-label="添加内容"')+btn('model-info','测试模型 ▾','model-action','aria-label="选择模型"')+btn('voice-info',ic('mic'),'voice-action','aria-label="语音输入"')+btn('send',ic('arrow'),'send primary','aria-label="发送消息" '+(!canSend()?'disabled':''))+'</div></div></div>'}
function sendIssue(){if(state.refs.some(r=>r.unavailable))return '有引用不可用，请移除后再发送。';if(state.refs.some(r=>r.stale))return '来源有更新，请选择保留所选版本或更新引用。';if(total(state.refs)>24000)return '超出 24,000 字符，请改用片段或减少引用。';return ''}
function pickerHtml(){const rows=docs.filter(d=>(state.pickTab==='all'||d.kind===state.pickTab)&&(d.title+' '+d.body).toLowerCase().includes(state.pickQuery.toLowerCase()));return '<div class="sheet-head"><div class="split"><h3>选择引用</h3>'+btn('cancel-picker','取消')+'</div><input data-input="pick-search" type="search" placeholder="搜索知识、笔记或资料" aria-label="搜索引用内容" value="'+esc(state.pickQuery)+'"></div><div class="tabs" role="tablist" aria-label="引用分类">'+['all','knowledge','notes','sources'].map(k=>btn('pick-tab:'+k,k==='all'?'全部':kindLabel(k),state.pickTab===k?'active':'','role="tab" aria-selected="'+(state.pickTab===k)+'"')).join('')+'</div><div class="sheet-content">'+(rows.length?rows.map(d=>'<div class="item"><label class="pick-row"><input type="checkbox" data-pick="'+d.id+'" aria-label="选择'+esc(d.title)+'" '+(state.pick.includes(d.id)?'checked':'')+' '+(!d.ready?'disabled':'')+'><span style="flex:1;min-width:0"><strong>'+esc(d.title)+'</strong><span class="pick-desc">'+kindLabel(d.kind)+' · v'+d.version+' · '+(d.ready?(d.body.length>1800?'默认选定片段':'全文 '+d.body.length+' 字符'):'没有可用正文')+'</span></span></label>'+btn('pick-preview:'+d.id,'预览','preview')+'</div>').join(''):'<div class="empty">没有匹配内容</div>')+'</div><footer class="sheet-footer"><div class="split"><span>已选 '+state.pick.length+'/8 项</span>'+btn('confirm-picker','添加引用','primary',''+(!state.pick.length?'disabled':''))+'</div><p class="hint">只添加到输入框，不发送。每项范围可继续调整。</p></footer>'}
function refPreview(r,index,historyOnly=false){const d=get(r.id);return '<p class="muted">'+kindLabel(r.kind)+' · 所选版本 v'+r.version+' · '+(r.mode==='full'?'全文':'选定片段')+' · '+r.text.length+' 字符</p>'+(historyOnly?'<div class="callout">这是发送当时的内容。来源后续更新不会改变这条历史引用。</div>':'')+(r.stale?'<div class="callout warn">当前来源为 v'+d.version+'，输入框仍保留 v'+r.version+'。不会悄悄替换你选中的内容。</div><div class="row">'+btn('keep-version:'+index,'保留所选版本','secondary')+btn('refresh-ref:'+index,'更新引用','primary')+'</div>':'')+(r.unavailable?'<div class="callout warn">引用已不可访问，不能继续发送。请移除并重新选择。</div>':'')+(!historyOnly&&!r.unavailable&&!r.stale?'<div class="choose">'+btn('range:'+index+':full','全文',r.mode==='full'?'active':'')+btn('range:'+index+':excerpt','选定片段',r.mode==='excerpt'?'active':'')+'</div>':'')+'<blockquote>'+esc(r.text)+'</blockquote>'+(!historyOnly?'<p class="hint">只引用此处文字，不自动包含它关联的其他来源。</p>':'')}
function renderModal(){if(!state.modal){modal.innerHTML='';return}let title='',content='',footer='',custom=false;const d=get(state.id);switch(state.modal){
case'add-menu':title='添加内容';content='<div class="add-menu"><span class="muted">添加到消息</span>'+btn('camera-info','相机')+btn('photo-info','图片')+btn('file-info','文件')+btn('conversation-reference-info','引用会话')+btn('picker',ic('book')+' 引用知识库')+'<hr><span class="muted">当前会话</span>'+btn('session-settings-info','会话设置')+'</div>';break;
case'app-nav':title='Helix';content='<div class="add-menu">'+btn('chat','对话')+btn('library','知识库')+'</div>';break;
case'chat-options':title='会话详情';content='<div class="add-menu">'+btn('history-list','相关问答记录')+btn('session-settings-info','会话设置')+'</div>';break;
case'composer-options':title='输入选项';content='<p>沿用现有 Helix 模式、权限、上下文及配置入口。引用内容不改变这些设置。</p>';break;
case'message-options':title='消息操作';content='<p>沿用已有编辑、复制、分支与朗读规则；用户消息不增加分支。本原型不重新实现消息操作。</p>';break;
case'permission-info':title='会话权限';content='<p>此处沿用当前会话权限菜单。选择知识引用不会切换权限模式，也不会授予工具能力。</p>';break;
case'model-info':title='模型选择';content='<p>此处沿用已有模型选择器。本原型使用演示目标，不更换实际 Provider、不请求账号。</p>';break;
case'context-info':title='上下文';content='<p>此处复用现有上下文用量与压缩入口；引用仍计入真实模型的上下文预算。原型不伪造 token 用量。</p>';break;
case'voice-info':title='语音输入';content='<p>沿用已有语音流程，转写进入同一输入框，不自动发送。本原型不录音。</p>';break;
case'camera-info':case'photo-info':case'file-info':case'conversation-reference-info':case'session-settings-info':case'chat-title':case'chat-search':case'new-chat':title='沿用已有会话功能';content='<p>Android 继续使用当前已实现的对应入口。本原型不打开设备能力，也不改写或清空实际会话。</p>';break;
case'picker':custom=true;content=pickerHtml();break;
case'ref':{const r=state.refs[state.detail];title=r.title;content=refPreview(r,state.detail);break}
case'pick-preview':{const x=get(state.detail);title=x.title;content=x.ready?refPreview(snapshotDoc(x.id),-1,true):'<div class="callout warn">原件没有可用文字，无法添加到本条引用。</div>';footer=btn('back-picker','返回选择','primary');break}
case'history-ref':{const [i,j]=state.detail;const r=history[i].refs[j];title=r.title;content=refPreview(r,j,true);break}
case'review':title='标记已核对';content='<p>表示你已核对关键事实与来源。它不是系统认证，也不会改变内容类型。</p>';footer=btn('confirm-review','确认已核对','primary');break;
case'more':title='内容操作';content='<div class="row">'+btn('delete-confirm','删除此内容','danger')+btn('export','导出 Markdown')+'</div>';break;
case'delete-confirm':title='删除这篇内容？';content='<p>仅删除本条演示内容，不删除其来源。已有历史消息保留发送时的引用。</p>';footer=btn('delete','确认删除','primary');break;
case'leave-edit':title='还有未保存的修改';content='<p>要保存这次编辑吗？保存不会改变笔记类型或核对状态。</p>';footer=btn('close','继续编辑','secondary')+btn('discard','放弃修改')+btn('save-edit','保存','primary');break;
case'distill':title='整理为知识';content='<p>以「'+esc(get(state.detail).title)+'」为来源，新建一篇可编辑知识。</p><div class="callout">原笔记或资料保持不变。提炼不代表核对，保存后仍可编辑。</div><label>主题<input data-input="distill-title" aria-label="知识主题" value="服务连接问题的排查清单"></label><p class="hint">原型使用预置合成草案，不调用模型。Android 接入后需明确模型和实际发送范围。</p>';footer=btn('distill-draft','查看演示草案','primary');break;
case'candidate':title='知识草案 · 尚未保存';content='<label>标题<input data-input="candidate-title" aria-label="候选知识标题" value="'+esc(state.candidate.title)+'"></label><label>Markdown 正文<textarea data-input="candidate-body" style="min-height:210px" aria-label="候选知识正文">'+esc(state.candidate.body)+'</textarea></label><p class="hint">来源保留链接；内容默认未核对，原笔记不变。</p>';footer=btn('cancel-candidate','放弃')+btn('save-candidate','保存为知识','primary');break;
case'confirm-send':title='确认本次发送';content='<p>目标：Helix 测试模型（云端）</p><div class="callout">'+state.refs.length+' 项引用，共 '+total(state.refs).toLocaleString()+' 字符，只附带到这条消息，不自动附带到下一条。已发送内容可能随会话历史继续参与上下文；原件和未选择资料不附带。</div>'+state.refs.map((r,i)=>'<div class="source-link">'+btn('ref:'+i,esc(r.title)+' · v'+r.version+' · '+(r.mode==='full'?'全文':'选定片段'))+'</div>').join('')+'<p class="hint">原型不连接模型；继续后只添加标注为演示的本地消息。</p>';footer=btn('close','返回编辑','secondary')+btn('commit-send','确认并演示发送','primary');break;
case'history-list':title='问答记录';content=history.length?history.map((m,i)=>btn('open-chat',esc(m.question),'source-link')).join(''):'<div class="empty"><h3>还没有问答记录</h3><p>从对话中选择引用开始。不会为每篇笔记自动创建问答。</p>'+btn('open-chat','去对话','primary')+'</div>';break;
case'export':title='导出';content='<p>Android 可沿用现有 Markdown 导出能力。这个原型不创建下载或打开系统分享。</p>';break;
case'import':title='导入资料';content='<p>Android 沿用现有文字、链接及文件导入。原型不访问文件，也不伪造导入成功。</p>';footer=btn('close','取消','secondary');break;
case'source':{const frozen=get(state.id)?.sourceSnapshots?.find(r=>r.id===state.detail),x=frozen||get(state.detail);title=x.title;content='<p class="muted">'+(frozen?'引用当时的内容':'来源内容')+' · v'+x.version+'</p>'+renderMd((frozen?x.text:x.body).slice(0,1400));break}
}
modal.innerHTML='<div class="overlay" data-overlay><section class="sheet '+(custom?'':'small')+'" role="dialog" aria-modal="true" aria-label="'+esc(title||'选择引用')+'">'+(custom?content:'<header class="sheet-head split"><h3>'+esc(title)+'</h3>'+btn('close','关闭')+'</header><div class="sheet-content">'+content+'</div>'+(footer?'<footer class="sheet-footer row">'+footer+'</footer>':''))+'</section></div>'}
function openDoc(id){state.id=id;state.page='read';state.editing=false;render()}
function newDoc(kind='notes'){const d={id:'local-'+Date.now(),kind,title:'',body:'',excerpt:'',version:0,refs:[],reviewed:false,date:'刚刚',ready:true};docs.push(d);state.id=d.id;state.page='read';state.editing=true;state.newDoc=true;state.editTitle='';state.editBody='';render()}
function action(a){const [key,id,arg]=a.split(':');if(state.editing&&['chat','open-chat','library','tab','open','new','create-knowledge','quote','ask','distill'].includes(key)){state.pending={action:a};sheet('leave-edit');return}switch(key){
case'library':if(state.editing){sheet('leave-edit');return}state.page='library';state.modal=null;render();break;
case'chat':case'open-chat':state.page='chat';state.modal=null;render();break;
case'tab':state.tab=id;state.query='';state.page='library';render();break;
case'clear-search':state.query='';render();break;
case'open':openDoc(id);break;
case'new':newDoc();break;
case'create-knowledge':newDoc('knowledge');break;
case'edit':state.editing=true;state.editTitle=get(state.id).title;state.editBody=get(state.id).body;render();break;
case'leave-edit':sheet('leave-edit');break;
case'discard':{const pending=state.pending;state.pending=null;if(state.newDoc)docs=docs.filter(x=>x.id!==state.id);state.editing=false;state.newDoc=false;state.modal=null;state.page='library';render();if(pending?.action)action(pending.action);if(pending?.scene)scene(pending.scene);break}
case'save-edit':{const d=get(state.id);if(!state.editTitle.trim()&&!state.editBody.trim()){notify('请先写下标题或正文');return}d.title=state.editTitle.trim()||'未命名笔记';d.body=state.editBody;d.excerpt=d.body.slice(0,180);d.version++;d.reviewed=false;d.date='刚刚';const pending=state.pending;state.pending=null;state.editing=false;state.newDoc=false;state.modal=null;render();notify('已保存，内容类型不变');if(pending?.action)action(pending.action);if(pending?.scene)scene(pending.scene);break}
case'quote':case'ask':if(!state.refs.some(r=>r.id===id)&&state.refs.length>=8){notify('最多选择 8 项引用');return}state.page='chat';if(!state.refs.some(r=>r.id===id))state.refs.push(snapshotDoc(id));render();notify('已添加引用，尚未发送');break;
case'picker':state.pick=state.refs.map(r=>r.id);state.pickTab='all';state.pickQuery='';sheet('picker');break;
case'pick-tab':state.pickTab=id;renderModal();break;
case'pick-preview':sheet('pick-preview',id);break;
case'back-picker':sheet('picker');break;
case'cancel-picker':state.pick=[];closeSheet();break;
case'confirm-picker':state.refs=state.pick.map(id=>state.refs.find(r=>r.id===id)||snapshotDoc(id));state.pick=[];state.modal=null;state.page='chat';render();notify('引用已添加，问题草稿保留');break;
case'ref':sheet('ref',Number(id));break;
case'remove':state.refs.splice(Number(id),1);render();break;
case'range':{const i=Number(id),old=state.refs[i];if(old.stale||old.unavailable)return;const fresh=snapshotDoc(old.id,arg);state.refs[i]=old.stale?{...fresh,version:old.version,text:arg==='full'?old.text:old.text.slice(0,180),stale:true}:fresh;render();break}
case'keep-version':state.refs[Number(id)].stale=false;render();notify('将引用明确选定的旧版本');break;
case'refresh-ref':state.refs[Number(id)]=snapshotDoc(state.refs[Number(id)].id,state.refs[Number(id)].mode);render();break;
case'history-ref':sheet('history-ref',[Number(id),Number(arg)]);break;
case'suggestion':state.draft=(state.draft.trim()?state.draft+'\n\n':'')+'请把这些方法整理成一份排查清单。';render();break;
case'send':if(canSend())sheet('confirm-send');break;
case'commit-send':{if(!canSend())return;history.push({question:state.draft,refs:structuredClone(state.refs),answer:state.refs.length?'演示：根据所选内容，可以先确认服务响应，再核查连接与执行结果。请点击引用，查看本次实际使用的版本与文字。':'演示：这条消息没有附带知识库内容。'});state.draft='';state.refs=[];state.modal=null;render();notify('演示消息已保存于本页，未发起网络请求');break}
case'review':sheet('review');break;
case'confirm-review':get(state.id).reviewed=true;closeSheet();render();break;
case'distill':state.distillSource=id;sheet('distill',id);break;
case'distill-draft':state.candidate={title:modal.querySelector('[data-input="distill-title"]').value||'新的知识',body:'## 适用场景\n连接服务出现异常时，先区分是否收到服务端响应。\n\n## 排查步骤\n1. 确认服务是否响应。\n2. 区分连接失败与服务暂不可用。\n3. 核查原操作，避免重复产生副作用。',source:state.distillSource};sheet('candidate');break;
case'cancel-candidate':state.candidate=null;closeSheet();break;
case'save-candidate':{const c=state.candidate;const d={id:'knowledge-'+Date.now(),kind:'knowledge',title:c.title.trim()||'未命名知识',body:c.body,excerpt:c.body.slice(0,180),refs:[c.source],sourceSnapshots:[snapshotDoc(c.source)],reviewed:false,version:1,date:'刚刚',ready:true};docs.push(d);state.candidate=null;state.modal=null;openDoc(d.id);notify('已保存为知识，原笔记保留；尚未核对');break}
case'save-answer':{const h=history[Number(id)];if(h.savedNoteId&&get(h.savedNoteId)){notify('这条回答已保存为笔记');return}h.savedNoteId='answer-'+Date.now();docs.push({id:h.savedNoteId,kind:'notes',title:'问答记录摘记',body:h.answer,excerpt:h.answer.slice(0,180),refs:h.refs.map(r=>r.id),sourceSnapshots:structuredClone(h.refs),version:1,reviewed:false,ready:true,date:'刚刚'});notify('已保存为笔记，不自动成为知识');break}
case'source':sheet('source',id);break;
case'add-menu':case'app-nav':case'chat-options':case'composer-options':case'message-options':case'permission-info':case'model-info':case'context-info':case'voice-info':case'camera-info':case'photo-info':case'file-info':case'conversation-reference-info':case'session-settings-info':case'chat-title':case'chat-search':case'new-chat':case'more':case'delete-confirm':case'export':case'import':case'history-list':sheet(key);break;
case'delete':{const id=state.id;docs=docs.filter(d=>d.id!==id);state.refs=state.refs.map(r=>r.id===id?{...r,unavailable:true}:r);state.modal=null;state.page='library';render();break}
case'close':closeSheet();break;
}}
root.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b&&!b.disabled)action(b.dataset.act);else if(e.target.hasAttribute('data-overlay'))closeSheet()});
root.addEventListener('input',e=>{const k=e.target.dataset.input;if(!k)return;const v=e.target.value;if(k==='draft'){state.draft=v;sizeDraft(e.target);const send=main.querySelector('[data-act="send"]');if(send)send.disabled=!canSend()}if(k==='edit-title')state.editTitle=v;if(k==='edit-body')state.editBody=v;if(k==='candidate-title')state.candidate.title=v;if(k==='candidate-body')state.candidate.body=v;if(k==='search'||k==='pick-search'){if(k==='search')state.query=v;else state.pickQuery=v;const pos=e.target.selectionStart;if(k==='search')main.innerHTML=libraryHtml();else renderModal();const input=root.querySelector('[data-input="'+k+'"]');input.focus();try{input.setSelectionRange(pos,pos)}catch(_){}}});
root.addEventListener('change',e=>{const id=e.target.dataset.pick;if(!id)return;if(e.target.checked){if(state.pick.length>=8){e.target.checked=false;notify('最多选择 8 项引用');return}state.pick.push(id)}else state.pick=state.pick.filter(x=>x!==id);renderModal()});
root.addEventListener('keydown',e=>{if(!state.modal)return;if(e.key==='Escape'){e.preventDefault();if(state.modal==='candidate'){action('cancel-candidate')}else closeSheet();return}if(e.key==='Tab'){const els=[...modal.querySelectorAll('button:not([disabled]),input:not([disabled]),textarea,select')];const first=els[0],last=els[els.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}}});
function scene(name){if(state.editing){state.pending={scene:name};sheet('leave-edit');return}if(name==='library'){state.page='library';state.tab='notes';state.modal=null;render();return}if(name==='distill'){state.id='n1';state.page='read';render();action('distill:n1');return}if(name==='history'){state.page='chat';state.modal=null;if(!history.length)history.push({question:'请依据这份知识说明应该如何排查。',refs:[snapshotDoc('k1')],answer:'演示：先区分连接是否建立，再确认服务响应。引用保留了发送时的版本。'});render();return}state.page='chat';state.modal=null;state.refs=[snapshotDoc('k1')];if(!state.draft)state.draft='请结合这份内容，帮我列出下一步检查项。';if(name==='update'){const d=get('k1');d.version++;d.body+='\n\n新增：保留原操作身份。';state.refs[0].stale=true}if(name==='unavailable')state.refs[0].unavailable=true;render()}
document.getElementById('scenes').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.scene)scene(b.dataset.scene);if(b.dataset.demo){const mode=b.dataset.demo;if(mode==='reset')reset();else{root.classList.toggle(mode);b.setAttribute('aria-pressed',String(root.classList.contains(mode)))}}});
window.helixKnowledge={action,scene,reset,snapshot:()=>structuredClone({state,docs,history}),canSend};reset();
})();
</script></body></html>
